plugins {
    id "com.android.application" version "8.9.2"
    id "com.google.dagger.hilt.android" version "2.48"
    id "com.chaquo.python" version "16.1.0"
    id "org.jetbrains.kotlin.android" version "1.9.22"
}

// 配置资源处理
afterEvaluate {
    if (android?.applicationVariants) {
        android.applicationVariants.all { variant ->
            variant.mergeAssetsProvider.configure { task ->
                task.doLast {
                    println "验证${variant.name}变体的assets目录..."
                    def assetsDir = task.outputDir.get().asFile
                    println "${variant.name}变体的assets目录: ${assetsDir.absolutePath}"
                }
            }
        }
    }
}

// org.jetbrains:annotations 和 annotations-java5 重复类
// 在 packagingOptions 中 pickFirst 解决（见下方 android.packagingOptions）

android {
    namespace "com.oilquiz.app"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.oilquiz.app"
        minSdk 31
        targetSdk 36
        versionCode 2
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionName "2.0"
        multiDexEnabled true
        
        // 本地库由 Gradle externalNativeBuild（CMake）直接编译：
        // CMake 产物输出到 src/main/jniLibs/<abi>/（见 src/main/cpp/CMakeLists.txt LIBRARY_OUTPUT_DIRECTORY），
        // AGP 打包时自动 strip。GGML_OPENCL=ON 为唯一 GPU backend（Adreno 优化 kernel，Vulkan 关闭）。
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -DNDEBUG -fno-finite-math-only"
                // HEXAGON-ENV-TO-VAR(2026-10-09)：Hexagon 后端需要的是 **CMake 变量**
                // HEXAGON_SDK_ROOT / HEXAGON_TOOLS_ROOT（见 ggml-hexagon/CMakeLists.txt:1-2
                // 的 file(TO_CMAKE_PATH ...)），而 src/main/cpp/CMakeLists.txt 只检查了
                // **环境变量**来开关 GGML_HEXAGON —— 两者是不同的命名空间，
                // 所以必须在这里显式把环境变量转成 -D 参数传进去，否则后端会因
                // IS_DIRECTORY("") 为假而 FATAL_ERROR。
                // 未设置环境变量时传空值，ggml-hexagon 不会被 add（GGML_HEXAGON=OFF），无副作用。
                def hexSdk   = System.getenv("HEXAGON_SDK_ROOT")   ?: ""
                def hexTools = System.getenv("HEXAGON_TOOLS_ROOT") ?: ""
                arguments "-DANDROID_STL=c++_shared", "-GNinja", "-DCMAKE_MAKE_PROGRAM=D:\\Android\\Sdk\\cmake\\3.22.1\\bin\\ninja.exe", "-DGGML_OPENCL=ON", "-DGGML_VULKAN=ON",
                          "-DHEXAGON_SDK_ROOT=${hexSdk}", "-DHEXAGON_TOOLS_ROOT=${hexTools}"
            }
        }
        ndk {
            // 仅 arm64-v8a：LibreOffice 引擎（viewer 模块 jniLibs）只有 arm64 版，去掉 x86_64 避免模拟器崩溃
            abiFilters "arm64-v8a"
        }
    }

    chaquopy {
        defaultConfig {
            version "3.10"
            // 构建用 Python 解释器:必须与 Android 端运行时(3.10)字节码兼容,
            // 即 buildPython 只能是 3.10(或 3.9)。3.12/3.14 的字节码 3.10 无法加载,
            // 会导致 .pyc 预编译失败(Chaquopy 警告,首次启动变慢)。
            // 故显式指定 3.10,修复 .pyc 预编译警告。
            // 2026-10-09: 改用项目内 _build_python 副本(已内置 chaquopy 定制 pip 20.1,
            // 支持 android_2x_arm64_v8a wheel 标签);原 Python310 的 pip 23.0.1 不识别
            // chaquopy Android wheel,交叉安装时死循环/失败。
            buildPython "D:\\qzq\\smartquiz\\_build_python\\python.exe"
            pip {
                // ===== 全部依赖本地化（2026-10-09）=====
                // 说明: install 全部用 python-wheels/ 下的文件路径, 不用名字 req,
                // 避免 pip 大批量名字解析/平台 tag 匹配触发死循环; 配合 --no-deps 零联网。
                // 传递依赖已全部显式列出, 缺一不可。
                install "python-wheels/requests-2.34.2-py3-none-any.whl"
                install "python-wheels/beautifulsoup4-4.15.0-py3-none-any.whl"
                install "python-wheels/jieba-0.42.1.tar.gz"
                install "python-wheels/python_docx-1.2.0-py3-none-any.whl"
                install "python-wheels/python_pptx-1.0.2-py3-none-any.whl"
                install "python-wheels/pypdf-6.19.0-py3-none-any.whl"
                install "python-wheels/xlsxwriter-3.2.9-py3-none-any.whl"
                install "python-wheels/html5lib-1.1-py2.py3-none-any.whl"
                install "python-wheels/webencodings-0.6.1-py3-none-any.whl"
                install "python-wheels/simplejson-4.1.2-py3-none-any.whl"
                install "python-wheels/pyopenssl-25.1.0-py3-none-any.whl"
                install "python-wheels/arabic_reshaper-3.0.1-py3-none-any.whl"
                install "python-wheels/python_bidi-0.4.2-py2.py3-none-any.whl"
                // native / 平台 wheel（Chaquopy Android 预编译）
                install "python-wheels/regex-2023.10.3-0-cp310-cp310-android_21_arm64_v8a.whl"
                install "python-wheels/pillow-11.0.0-0-cp310-cp310-android_24_arm64_v8a.whl"
                install "python-wheels/numpy-1.26.2-0-cp310-cp310-android_21_arm64_v8a.whl"
                install "python-wheels/lxml-5.3.0-0-cp310-cp310-android_24_arm64_v8a.whl"
                install "python-wheels/cryptography-42.0.8-0-cp310-cp310-android_24_arm64_v8a.whl"
                install "python-wheels/openpyxl-3.1.5-py2.py3-none-any.whl"
                install "python-wheels/et_xmlfile-2.0.0-py3-none-any.whl"
                install "python-wheels/jdcal-1.4.1-py2.py3-none-any.whl"
                install "python-wheels/pyyaml-6.0.3-0-cp310-cp310-android_24_arm64_v8a.whl"
                install "python-wheels/tabulate-0.10.0-py3-none-any.whl"
                install "python-wheels/python_dateutil-2.9.0.post0-py2.py3-none-any.whl"
                install "python-wheels/six-1.17.0-py2.py3-none-any.whl"
                install "python-wheels/chardet-7.6.0-py3-none-any.whl"
                install "python-wheels/xlrd-2.0.2-py2.py3-none-any.whl"
                install "python-wheels/reportlab-5.0.1-py3-none-any.whl"
                install "python-wheels/matplotlib-3.6.0-0-cp310-cp310-android_21_arm64_v8a.whl"
                install "python-wheels/pandas-2.1.3-1-cp310-cp310-android_24_arm64_v8a.whl"
                install "python-wheels/pytz-2026.5-py2.py3-none-any.whl"
                install "python-wheels/tzdata-2026.5-py2.py3-none-any.whl"
                // 传递依赖
                install "python-wheels/certifi-2026.7.22-py3-none-any.whl"
                install "python-wheels/idna-3.20-py3-none-any.whl"
                install "python-wheels/urllib3-2.8.0-py3-none-any.whl"
                install "python-wheels/charset_normalizer-3.5.2-py3-none-any.whl"
                install "python-wheels/soupsieve-2.10-py3-none-any.whl"
                install "python-wheels/typing_extensions-4.16.0-py3-none-any.whl"
                install "python-wheels/cffi-1.17.1-1-cp310-cp310-android_24_arm64_v8a.whl"
                install "python-wheels/pycparser-3.1-py3-none-any.whl"
                install "python-wheels/contourpy-1.0.5-0-cp310-cp310-android_21_arm64_v8a.whl"
                install "python-wheels/cycler-0.12.1-py3-none-any.whl"
                install "python-wheels/fonttools-4.65.0-py3-none-any.whl"
                install "python-wheels/kiwisolver-1.4.5-0-cp310-cp310-android_21_arm64_v8a.whl"
                install "python-wheels/packaging-26.3-py3-none-any.whl"
                install "python-wheels/pyparsing-3.3.3-py3-none-any.whl"
                // chaquopy 系统库（native 依赖）
                install "python-wheels/chaquopy_libjpeg-1.5.3-1-py3-none-android_21_arm64_v8a.whl"
                install "python-wheels/chaquopy_freetype-2.9.1-2-py3-none-android_21_arm64_v8a.whl"
                install "python-wheels/chaquopy_libpng-1.6.34-1-py3-none-android_21_arm64_v8a.whl"
                install "python-wheels/chaquopy_libxml2-2.9.8-2-py3-none-android_21_arm64_v8a.whl"
                install "python-wheels/chaquopy_libxslt-1.1.32-2-py3-none-android_21_arm64_v8a.whl"
                install "python-wheels/chaquopy_libyaml-0.2.5-0-py3-none-android_24_arm64_v8a.whl"
                install "python-wheels/chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl"
                install "python-wheels/chaquopy_openblas-0.2.20-5-py3-none-android_21_arm64_v8a.whl"
                install "python-wheels/chaquopy_libgfortran-4.9-0-py3-none-android_21_arm64_v8a.whl"

                // 2026-10-09：本地 wheel 兜底 + 全文件路径, pip 零联网零名字解析;
                // --no-deps 跳过依赖解析器（大批量解析是 pip 死循环根因）。
                options "--no-deps"
                options "--find-links", "file:///D:/qzq/smartquiz/python-wheels"
            }
        }
    }

    packagingOptions {
        exclude "META-INF/DEPENDENCIES"
        exclude "META-INF/LICENSE"
        exclude "META-INF/LICENSE.txt"
        exclude "META-INF/NOTICE"
        exclude "META-INF/NOTICE.txt"
        exclude "META-INF/INDEX.LIST"
        exclude "META-INF/io.netty.versions.properties"
        exclude "mozilla/public-suffix-list.txt"
        // flexmark 等库的重复 LICENSE 文件
        exclude "META-INF/LICENSE-LGPL-3.txt"
        exclude "META-INF/LICENSE-LGPL-2.1.txt"
        exclude "META-INF/LICENSE-2.0.txt"
        exclude "META-INF/AL2.0"
        exclude "META-INF/LGPL2.1"
        exclude "META-INF/LICENSE-W3C-TEST"

        pickFirst "**/libvulkan.so.*"
        pickFirst "**/libc++_shared.so"
        // libomp.so 两边都有：我们自己的 llama.cpp（libllama-jni.so 的 DT_NEEDED 里有 libomp.so）
        // 和 GenieX AAR。GenieX 的库实测不需要 libomp（libggml-cpu/libllama 都不依赖它），
        // 所以显式让 jniLibs 里我们那份胜出，顺便消掉 AGP 的 "2 files found for path" 告警。
        pickFirst "**/libomp.so"
        exclude "**/org/apache/commons/math3/**"

        jniLibs {
            // 内置 Linux 命令工具链（libbusybox.so = Alpine busybox-static，aarch64 静态二进制）：
            // targetSdk>=29 的应用不能执行自己写进 data 目录的文件，只有系统解压出来的
            // nativeLibraryDir 里的文件才允许 execve —— 所以必须打开 legacy 打包方式（=解压）。
            // Android 里 ApplicationInfo.nativeLibraryDir 会指向这些真实文件。
            useLegacyPackaging = true
            // busybox 是已 strip 过的 ELF 可执行文件，别让 AGP 的 strip 任务再动它
            // 内置工具链全部免 strip：既有已 strip 的 ELF，也有 shell 脚本(包装)、tar.gz(依赖库包)、
            // PEM(CA) 与 JSON(工具清单)，AGP 对非 ELF 跑 llvm-strip 会失败
            keepDebugSymbols += ["**/libbusybox*.so", "**/libwget_shim.so",
                                 "**/libopenssl_bin.so", "**/libcrypto.so", "**/libssl.so",
                                 "**/libz.so", "**/libcacert.pem.so",
                                 "**/libssh_*.so", "**/libssh_libs.so",
                                 "**/liblauncher.so", "**/libtoolkit_*.so", "**/lib*_bin.so"]
            // Qualcomm QAIRT/QNN + Genie 预编译库：Hexagon DSP skel 带 Qualcomm 签名目录(.cat)，
            // 被 llvm-strip 动过就可能加载失败 → 一律免 strip
            keepDebugSymbols += ["**/libQnn*.so", "**/libGenie.so", "**/libcalculator*.so"]
        }
    }

    signingConfigs {
        release {
            storeFile file("smartquiz.keystore")
            storePassword "password"
            keyAlias "smartquiz"
            keyPassword "password"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            def baseName = "答题宝"
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            outputFileName = "${baseName}-${buildType}-${versionName}.apk"
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable "MissingTranslation"
    }

    testOptions {
        unitTests {
            // android.jar 里的框架类是编译桩：本地单元测试中未被 mock 的方法
            // 默认抛 "not mocked" 异常（如 android.util.Log.i 一调就炸）。
            // 开启后桩方法返回默认值；真实实现（org.json 等）已由 testImplementation 显式引入。
            returnDefaultValues = true
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // 和风天气 Android SDK
    implementation files('libs/QWeather_Public_Android_V5.2.2.jar')
    // APK 签名库（App 内导出 APK 用：v1+v2+v3 签名，签名时自动对齐 STORED 条目）
    implementation files('libs/apksig-8.0.2.jar')
    // Qualcomm GenieX Android SDK（NPU 端侧 LLM 推理：llama_cpp 跑 GGUF NPU/GPU/CPU，qairt 跑 AI Hub 预编译）
    // 本地 AAR：阿里云镜像未同步 0.8.0（发布 <24h），官方 Maven Central 国内慢；本地文件最稳。
    // 自带 arm64 native 库 + 模型下载/管理，无需 NDK/CMake。支持 SM8750/SM8850。
    implementation files('libs/geniex-android-0.8.0.aar')
    // 本地高精度 OCR：RapidOCR4j-Android（RapidOCR Java 移植，PaddleOCR 系模型 + ONNX Runtime + OpenCV，
    // 端侧离线，中文精度远高于 ML Kit；内部已带 onnxruntime-android:1.18.0 与 opencv:4.9.0）
    implementation "io.github.hzkitty:rapidocr4j-android:1.0.0"
    // 本地离线语音识别（SenseVoice）：直接复用 onnxruntime-android（rapidocr4j 已传递同版本，显式声明确保 API 可见）
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.18.0"
    implementation "net.i2p.crypto:eddsa:0.3.0"
    // SSH 纯 Java 库（agent 的 ssh_exec 工具用：连接任意远程主机、密码/密钥认证、sftp、端口转发。
    // 用社区活跃维护版 com.github.mwiede:jsch（官方 jcraft 停在 0.1.55 已不再维护）；
    // 2.28.x 已修复 Terrapin(CVE-2023-48795) 等漏洞，ed25519 支持复用上面的 eddsa）
