    // 走 MediaCodec 硬件编解码，不打包 ffmpeg，体积几乎不增加（transformer 约 300KB）。
    implementation "androidx.media3:media3-transformer:1.3.1"
    implementation "androidx.media3:media3-effect:1.3.1"

    // ===== ffmpeg 引擎（media_toolkit 的 engine=ffmpeg 回退/扩展）=====
    // 为什么用这个坐标：原 com.arthenica:ffmpeg-kit-* 已于 2025-04 停止维护并从仓库撤下；
    // dev.ffmpegkit-maintained 是活跃维护的 drop-in 分叉（同一套 com.arthenica.ffmpegkit API）。
    // 为什么这次能成（之前 Termux 版失败两次）：这些是 NDK/bionic 构建的 libav*，
    // 走 jniLibs → nativeLibraryDir → System.loadLibrary 正常加载，**不需要 exec、不需要任何权限**；
    // Termux 那套是动态链接到 Termux 自己的 stub 库/同名不同 ABI 的 libc++，加载阶段就炸。
    // min 变体不含外部库（无 x264/mp3lame），但 rv40/cook/wmv3/vc1 等原生解码器齐全，
    // 且带 h264/hevc/aac 的 MediaCodec 硬件桥。仅 arm64-v8a + x86_64，我们 arm64-only → 约 +8MB APK。
    // 注意 @aar + 显式声明它的传递依赖 smart-exception-java：
    // 这个 AAR 只有 POM（无 Gradle Module Metadata），AGP 的 dataBinding 取产物步骤会去找 .jar 而失败。
    // 强制按 aar 产物解析即可绕过；@aar 会丢掉 POM 里的传递依赖，所以下面手工补上。
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.9@aar"
    implementation "com.arthenica:smart-exception-java:0.2.1"
    
    // PdfiumAndroid - 免费开源PDF渲染库 (Google Pdfium)
    implementation("com.github.barteksc:pdfium-android:1.9.0") {
        exclude group: 'com.android.support'
    }
    
    // TBS SDK - 需要从腾讯云官网下载后放入 libs/ 目录
    // （X5 已停止官方维护，Maven 仅有壳 jar 无内核 so，设备实测不可用；暂不集成）
    // implementation 'com.tencent.tbs:tbssdk:54002-beta'
    // implementation files('libs/TbsFileSdk_base_universal_1.0.5.6000094.20250604183316.aar')
    
    // Bouncy Castle库，用于创建标准的X.509证书
    implementation "org.bouncycastle:bcpkix-jdk18on:1.76"
    implementation "org.bouncycastle:bcprov-jdk18on:1.76"
    
    // Easy Rules 规则引擎
    implementation "org.jeasy:easy-rules-core:4.1.0"
    implementation "org.jeasy:easy-rules-support:4.1.0"
    
    // Hilt 依赖注入框架
    implementation "com.google.dagger:hilt-android:2.48"
    annotationProcessor "com.google.dagger:hilt-compiler:2.48"
    
    // 解决依赖冲突
    configurations.all {
        // 排除旧版本的Bouncy Castle库，避免版本冲突
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
        
        // 解决guava和listenablefuture的依赖冲突
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    
    // 测试依赖
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:4.8.1"
    testImplementation "org.robolectric:robolectric:4.10.3"
    testImplementation "androidx.test:core:1.5.0"
    // 单元测试用真实 org.json：android.jar 里的 org.json 是编译桩（方法体 throw Stub!），
    // 纯 JVM 单元测试（未走 Robolectric shadow）撞上会直接崩溃，故显式引入真实实现。
    testImplementation "org.json:json:20160810"
    // AndroidJUnit4 运行器（本地单元测试走 Robolectric）；此前只在 androidTestImplementation 声明，
    // 导致 @RunWith(AndroidJUnit4) 的单元测试（如 ExportTemplateTest）无法编译。
    testImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:core:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    // AndroidJUnitRunner 本体在 androidx.test:runner 里：只声明 ext:junit 时测试 APK 缺这个类，
    // 真机上会报 ClassNotFoundException: androidx.test.runner.AndroidJUnitRunner（已实测）
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "org.mockito:mockito-android:4.8.1"
    implementation project(':viewer')
}

// ============================================================================
// DSH 修复: Chaquopy 16.1.0 pip_install.py 排除阶段的崩溃
// ----------------------------------------------------------------------------
// 现象: :generateDebugPythonRequirements 失败, 报
//   FileNotFoundError: [WinError 3] 系统找不到指定的路径:
//     ...\build\python\pip\debug\arm64-v8a\chaquopy\include\freetype\config\ftheader.h
// 原因: pip_install.py 第 146 行对命中 EXCLUDE_PATTERNS 的文件调用
//   remove(path_abs, remove_empty_dirs=True)
// 而 remove() 里的 os.removedirs(dirname(path)) 会连带删除"已变空"的父目录。
// 当同一轮扫描继续处理该目录下其它文件时, os.remove() 因父目录已消失而抛
// WinError 3(路径不存在)。注意这不是杀软误删 —— WinError 3 说明是"目录"
// 不在了, 是 Chaquopy 自己的清理逻辑删掉的, 且每次构建都在同一处复现。
// 修复: 把 remove() 改成容错版本(文件已不存在即视为已达成排除目的)。
// 挂载点很关键: 必须挂在 generate*PythonRequirements 的 doFirst 上。
// 曾经挂在 extract*PythonBuildPackages 的 doLast 上, 但 configureEach 的回调
// 早于插件自己注册解包动作, 补丁会在文件解出来之前跑, 结果静默失效。
// generate 依赖 extract, 所以 doFirst 执行时环境一定已经就绪。
def dshPatchChaquopyPipInstall = { File envDir ->
    def f = new File(envDir, "lib/site-packages/chaquopy/pip_install.py")
    if (!f.isFile()) {
        logger.warn("[DSH] 未找到 ${f}, 跳过 Chaquopy 补丁 (build python 环境可能未解包成功)")
        return
    }
    def text = f.getText("UTF-8")
    def dirty = false

    // 补丁1: remove() 容错 (原有)
    if (!text.contains("DSH-PATCH")) {
        def oldCall = "    (rmtree if isdir(path) else os.remove)(path)"
        def idx = text.indexOf(oldCall)
        if (idx < 0) {
            logger.warn("[DSH] 未在 pip_install.py 中找到预期的 remove() 代码, 跳过 Chaquopy 补丁")
        } else {
            def end = idx + oldCall.length()
            if (text.startsWith("\r\n", end)) {
                end += 2
            } else if (text.startsWith("\n", end)) {
                end += 1
            }
            text = text.substring(0, idx) +
                    "    try:  # DSH-PATCH: 父目录已被 os.removedirs 删除时不应中断构建\n" +
                    "        (rmtree if isdir(path) else os.remove)(path)\n" +
                    "    except FileNotFoundError:\n" +
                    "        pass\n" +
                    text.substring(end)
            dirty = true
        }
    }

    // 补丁2 (2026-10-09): pip 子进程固定为 env python(自带 pip 20.1, 旧 resolver 正常),
    // 避开 buildPython(Python310 pip 23.0.1) 新 resolver 在 --platform 交叉安装时的死循环。
    if (!text.contains("DSH-PATCH2")) {
        def oldCall2 = "cmdline = ([sys.executable,"
        def idx2 = text.indexOf(oldCall2)
        if (idx2 < 0) {
            logger.warn("[DSH] 未在 pip_install.py 中找到 cmdline sys.executable, 跳过 pip 子进程补丁")
        } else {
            def envPy = new File(envDir, "Scripts/python.exe").absolutePath.replace('\\', '/')
            text = text.substring(0, idx2) +
                    "cmdline = ([r\"${envPy}\",  # DSH-PATCH2: 固定用 env pip 20.1, 避开 pip 23 resolver 死循环\n" +
                    text.substring(idx2 + oldCall2.length())
            dirty = true
        }
    }

    // 补丁3 (2026-10-09): 大批量 reqs 一次性传给 pip 时, pip(20.1/23.0.1) 都容易
    // 在收集/解析阶段死循环或长时间无响应; 改为按 BATCH=8 分批调用, 每批独立 pip 进程,
    // 装到同一 target 目录, 结果等价但稳定。
    if (!text.contains("DSH-PATCH3")) {
        def oldTail = "           self.pip_options + reqs)"
        def idx3 = text.indexOf(oldTail)
        if (idx3 < 0) {
            logger.warn("[DSH] 未在 pip_install.py 中找到 pip_options + reqs 拼接, 跳过分批补丁")
        } else {
            def head = text.substring(0, idx3)
            def tail = text.substring(idx3 + oldTail.length())
            // 1) cmdline 去掉 reqs(改为逐批追加)
            def replaced = head + "           self.pip_options)"
            // 2) check_call 改为分批循环
            def oldCall3 = "            logger.debug(\"Running {}\".format(cmdline))\n            subprocess.check_call(cmdline)"
            def idx4 = replaced.indexOf(oldCall3)
            if (idx4 < 0) {
                logger.warn("[DSH] 未在 pip_install.py 中找到 check_call(cmdline), 跳过分批循环补丁")
            } else {
                replaced = replaced.substring(0, idx4) +
                        "            logger.debug(\"Running {}\".format(cmdline))\n" +
                        "            _BATCH = 8  # DSH-PATCH3: 分批安装, 避免大批量 reqs 触发 pip 异常\n" +
                        "            for _i in range(0, len(reqs), _BATCH):\n" +
                        "                subprocess.check_call(cmdline + list(reqs[_i:_i + _BATCH]))\n" +
                        replaced.substring(idx4 + oldCall3.length())
                text = replaced + tail
                dirty = true
            }
        }
    }

    if (dirty) {
        f.setText(text, "UTF-8")
        logger.lifecycle("[DSH] 已应用 Chaquopy pip_install.py 补丁(remove 容错 + pip 子进程固定 env + 分批安装): ${f}")
    }
}

tasks.matching { it.name.startsWith("generate") && it.name.endsWith("PythonRequirements") }
        .configureEach { t ->
            def m = (t.name =~ /^generate(.+)PythonRequirements$/)
            if (m.matches()) {
                def variant = m[0][1].toLowerCase()
                t.doFirst {
                    dshPatchChaquopyPipInstall(
                            new File(t.project.buildDir, "python/env/${variant}"))
                }
            }
        }

// ============================================================================
// DSH 修复: llama.cpp 的 OpenCL kernel 生成脚本在中文 Windows 上崩溃
// ----------------------------------------------------------------------------
// 现象: buildCMakeDebug[arm64-v8a] 失败, 报
//   UnicodeDecodeError: 'gbk' codec can't decode byte 0x94 in position 8143
// 原因: ggml-opencl/kernels/embed_kernel.py 用默认编码 open() 读 .cl 文件,
//   而中文 Windows 的默认编码是 GBK; 9 个 .cl 里有 em-dash/乘号等 UTF-8 字符
//   (已验证这 9 个文件都是合法 UTF-8), 于是解码失败, .cl.h 生成不出来。
// 修复: 显式用 UTF-8 读写。
// 为什么放在 build.gradle 而不是直接改那个文件:
//   src/main/cpp/llama.cpp 是一个嵌套的 git 仓库(外层 .gitignore 排除了整个目录),
//   对它的改动无法随外层仓库提交 —— git add 只会加一个 gitlink, 内容不会入库。
//   放在这里做自愈式守卫, 重新 clone llama.cpp 之后依然会自动修好。
// ============================================================================
def dshFixEmbedKernel = { File f ->
    if (!f.isFile()) {
        logger.warn("[DSH] 未找到 embed_kernel.py, 跳过 UTF-8 守卫: ${f}")
        return
    }
    def text = f.getText("UTF-8")
    if (text.contains('encoding="utf-8"')) {
        return  // 已修好
    }
    def fixed = text
            .replace('open(sys.argv[1], "r")', 'open(sys.argv[1], "r", encoding="utf-8")')
            .replace('open(sys.argv[2], "w")', 'open(sys.argv[2], "w", encoding="utf-8")')
    if (fixed == text) {
        logger.warn("[DSH] embed_kernel.py 中未找到预期 open() 调用, 跳过 UTF-8 守卫")
        return
    }
    f.setText(fixed, "UTF-8")
    logger.lifecycle("[DSH] 已修正 embed_kernel.py 的 UTF-8 编码: ${f}")
}
dshFixEmbedKernel(new File(rootDir,
        "src/main/cpp/llama.cpp/ggml/src/ggml-opencl/kernels/embed_kernel.py"))
