    // 阿里云百炼（DashScope）官方 Java SDK：在线 TTS/ASR 改用官方 SDK（2.22.28 已含 Qwen-TTS / CosyVoice / Qwen3-ASR）
    // 项目已含 okhttp:4.12.0 与 gson:2.10.1，冲突风险低；debug/release 均未开 minify，无需 proguard keep 规则
