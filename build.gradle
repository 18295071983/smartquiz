plugins {
    id "com.android.application" version "8.9.2"
    id "com.google.dagger.hilt.android" version "2.48"
    id "com.chaquo.python" version "16.1.0"
    id "org.jetbrains.kotlin.android" version "1.9.22"
}

// 配置资源处理
afterEvaluate {
    if (android?.applicationVariants) {
        android.applicationVariants.all { variant ->
            variant.mergeAssetsProvider.configure { task ->
                task.doLast {
                    println "验证${variant.name}变体的assets目录..."
                    def assetsDir = task.outputDir.get().asFile
                    println "${variant.name}变体的assets目录: ${assetsDir.absolutePath}"
                }
            }
        }
    }
}

// org.jetbrains:annotations 和 annotations-java5 重复类
// 在 packagingOptions 中 pickFirst 解决（见下方 android.packagingOptions）

android {
    namespace "com.oilquiz.app"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.oilquiz.app"
        minSdk 31
        targetSdk 36
        versionCode 2
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionName "2.0"
        multiDexEnabled true
        
        // 本地库由 Gradle externalNativeBuild（CMake）直接编译：
        // CMake 产物输出到 src/main/jniLibs/<abi>/（见 src/main/cpp/CMakeLists.txt LIBRARY_OUTPUT_DIRECTORY），
        // AGP 打包时自动 strip。GGML_OPENCL=ON 为唯一 GPU backend（Adreno 优化 kernel，Vulkan 关闭）。
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -DNDEBUG -fno-finite-math-only"
                arguments "-DANDROID_STL=c++_shared", "-GNinja", "-DCMAKE_MAKE_PROGRAM=D:\\Android\\Sdk\\cmake\\3.22.1\\bin\\ninja.exe", "-DGGML_OPENCL=ON", "-DGGML_VULKAN=ON"
            }
        }
        ndk {
            // 仅 arm64-v8a：LibreOffice 引擎（viewer 模块 jniLibs）只有 arm64 版，去掉 x86_64 避免模拟器崩溃
            abiFilters "arm64-v8a"
        }
    }

    chaquopy {
        defaultConfig {
            version "3.10"
            // 构建用 Python 解释器:必须与 Android 端运行时(3.10)字节码兼容,
            // 即 buildPython 只能是 3.10(或 3.9)。3.12/3.14 的字节码 3.10 无法加载,
            // 会导致 .pyc 预编译失败(Chaquopy 警告,首次启动变慢)。
            // 故显式指定 3.10,修复 .pyc 预编译警告。
            buildPython "C:\\Users\\xiaocong\\AppData\\Local\\Programs\\Python\\Python310\\python.exe"
            pip {
                // 纯Python包从本地wheel/sdist安装，无需联网
                install "python-wheels/requests-2.34.2-py3-none-any.whl"
                install "python-wheels/beautifulsoup4-4.15.0-py3-none-any.whl"
                install "python-wheels/jieba-0.42.1.tar.gz"

                // ===== 文档读写（纯Python本地wheel；原生依赖 lxml/Pillow 见下方 install；typing-extensions 已随 bs4 自动装）=====
                install "python-wheels/python_docx-1.2.0-py3-none-any.whl"          // Word .docx 读写        → import docx
                install "python-wheels/python_pptx-1.0.2-py3-none-any.whl"          // PowerPoint .pptx 读写 → import pptx
                install "python-wheels/pypdf-6.19.0-py3-none-any.whl"               // PDF 读取/合并/拆分     → import pypdf
                install "python-wheels/xlsxwriter-3.2.9-py3-none-any.whl"           // python-pptx 依赖       → import xlsxwriter

                // ===== 文档/网络可选依赖（纯Python本地wheel；cryptography 为 native，见下方 install）=====
                install "python-wheels/html5lib-1.1-py2.py3-none-any.whl"            // bs4 可选解析器（容错解析）  → import html5lib
                install "python-wheels/webencodings-0.6.1-py3-none-any.whl"          // html5lib 依赖              → import webencodings
                install "python-wheels/simplejson-4.1.2-py3-none-any.whl"            // requests 可选 JSON 加速    → import simplejson
                install "python-wheels/pyopenssl-25.1.0-py3-none-any.whl"            // requests 可选 TLS 后端     → import OpenSSL（需 cryptography，25.1.0 兼容 42.0.8）
                install "python-wheels/arabic_reshaper-3.0.1-py3-none-any.whl"       // pypdf RTL 排版             → import arabic_reshaper
                install "python-wheels/python_bidi-0.4.2-py2.py3-none-any.whl"       // pypdf RTL 依赖             → import bidi
                
                // native包从Chaquopy源获取Android预编译wheel
                // 国内镜像源作为额外源加速下载
                options "--extra-index-url", "https://pypi.tuna.tsinghua.edu.cn/simple/"
                options "--trusted-host", "pypi.tuna.tsinghua.edu.cn"
                options "--extra-index-url", "https://mirrors.aliyun.com/pypi/simple/"
                options "--trusted-host", "mirrors.aliyun.com"
                
                // 已预装 native 包
                install "regex"
                install "Pillow"
                install "numpy"
                install "lxml"
                // pypdf 读加密 PDF(AES) + pyOpenSSL 的依赖；Chaquopy 提供 cp310/android_24/arm64 轮子（42.0.8，满足 pypdf>=36）
                install "cryptography"
                
                // ===== Agent 实用第三方库 =====
                // 纯Python包 - 直接从PyPI/镜像安装（依赖Chaquopy源获取native轮子）
                install "openpyxl"          // Excel .xlsx 读写（依赖：et_xmlfile, jdcal）
                install "et_xmlfile"        // openpyxl 依赖
                install "jdcal"             // openpyxl 依赖（日期计算）
                install "pyyaml"            // YAML 解析
                install "tabulate"          // 数据表格美观输出
                install "python-dateutil"   // 灵活日期解析（依赖six）
                install "six"               // python-dateutil 依赖
                install "chardet"           // 文件编码自动检测
                install "xlrd"              // 旧版 .xls Excel 读取
                install "reportlab"          // PDF 生成（支持中文）
                // 图表绘制（依赖：contourpy, kiwisolver, fonttools, cycler, pyparsing, packaging）
                // contourpy / kiwisolver 由 Chaquopy 源提供 Android 预编译轮子
                install "matplotlib"
                
                // Android 预编译 native 包 - Chaquopy 自动从 PyPI 获取 Android wheel
                install "pandas"            // 数据分析（依赖：numpy, python-dateutil, pytz, tzdata）
                install "pytz"              // pandas 依赖（时区处理）
                install "tzdata"            // pandas 依赖（Windows 时区支持）
            }
        }
    }

    packagingOptions {
        exclude "META-INF/DEPENDENCIES"
        exclude "META-INF/LICENSE"
        exclude "META-INF/LICENSE.txt"
        exclude "META-INF/NOTICE"
        exclude "META-INF/NOTICE.txt"
        exclude "META-INF/INDEX.LIST"
        exclude "META-INF/io.netty.versions.properties"
        exclude "mozilla/public-suffix-list.txt"
        // flexmark 等库的重复 LICENSE 文件
        exclude "META-INF/LICENSE-LGPL-3.txt"
        exclude "META-INF/LICENSE-LGPL-2.1.txt"
        exclude "META-INF/LICENSE-2.0.txt"
        exclude "META-INF/AL2.0"
        exclude "META-INF/LGPL2.1"
        exclude "META-INF/LICENSE-W3C-TEST"

        pickFirst "**/libvulkan.so.*"
        pickFirst "**/libc++_shared.so"
        exclude "**/org/apache/commons/math3/**"

        jniLibs {
            // 内置 Linux 命令工具链（libbusybox.so = Alpine busybox-static，aarch64 静态二进制）：
            // targetSdk>=29 的应用不能执行自己写进 data 目录的文件，只有系统解压出来的
            // nativeLibraryDir 里的文件才允许 execve —— 所以必须打开 legacy 打包方式（=解压）。
            // Android 里 ApplicationInfo.nativeLibraryDir 会指向这些真实文件。
            useLegacyPackaging = true
            // busybox 是已 strip 过的 ELF 可执行文件，别让 AGP 的 strip 任务再动它
            // 内置工具链全部免 strip：既有已 strip 的 ELF，也有 shell 脚本(包装)、tar.gz(依赖库包)、
            // PEM(CA) 与 JSON(工具清单)，AGP 对非 ELF 跑 llvm-strip 会失败
            keepDebugSymbols += ["**/libbusybox*.so", "**/libwget_shim.so",
                                 "**/libopenssl_bin.so", "**/libcrypto.so", "**/libssl.so",
                                 "**/libz.so", "**/libcacert.pem.so",
                                 "**/libssh_*.so", "**/libssh_libs.so",
                                 "**/liblauncher.so", "**/libtoolkit_*.so", "**/lib*_bin.so"]
        }
    }

    signingConfigs {
        release {
            storeFile file("smartquiz.keystore")
            storePassword "password"
            keyAlias "smartquiz"
            keyPassword "password"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            def baseName = "答题宝"
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            outputFileName = "${baseName}-${buildType}-${versionName}.apk"
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable "MissingTranslation"
    }

    testOptions {
        unitTests {
            // android.jar 里的框架类是编译桩：本地单元测试中未被 mock 的方法
            // 默认抛 "not mocked" 异常（如 android.util.Log.i 一调就炸）。
            // 开启后桩方法返回默认值；真实实现（org.json 等）已由 testImplementation 显式引入。
            returnDefaultValues = true
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

