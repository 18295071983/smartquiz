<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cube Clock – Black Theme</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="container">
  <div id="room">
    <div id="bottom-wall" class="horizon-wall"></div>
    <div id="upper-wall" class="horizon-wall"></div>
    <div id="back-wall" class="vertical-wall">
      <div class="shadow"></div>
      <div class="shadow"></div>
      <div class="shadow"></div>
    </div>
    <div id="left-wall" class="vertical-wall"></div>
    <div id="right-wall" class="vertical-wall"></div>
  </div>

  <div id="clock">
    <div id="hour-cube">
      <div class="front-surface">00</div>
      <div class="upper-surface">00<div class="hidden-surface"></div></div>
      <div class="left-surface"></div>
      <div class="right-surface"></div>
    </div>

    <div id="minute-cube">
      <div class="front-surface">00</div>
      <div class="upper-surface">00<div class="hidden-surface"></div></div>
      <div class="left-surface"></div>
      <div class="right-surface"></div>
    </div>

    <div id="second-cube">
      <div class="front-surface">00</div>
      <div class="upper-surface">00<div class="hidden-surface"></div></div>
      <div class="left-surface"></div>
      <div class="right-surface"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
