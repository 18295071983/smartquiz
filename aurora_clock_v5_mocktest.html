<!DOCTYPE html>
<html lang="zh-CN" data-theme="aurora" data-face="flip" data-fx="stars">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06101e">
<title>极光时钟</title>
<style>
/* ========== 主题变量：12 套 ========== */
:root{--cw:100vw;--ch:100vh;--r:18px;--acc:#5ef2c9;--acc2:#7c9cff;--glow:94,242,201;--bg1:#06101e;--bg2:#0b2233;--txt:#eaf6ff;--dim:#8fb3c9;--panel:rgba(10,32,48,.55);--line:rgba(120,220,200,.18)}
[data-theme=aurora]{--acc:#5ef2c9;--acc2:#7c9cff;--glow:94,242,201;--bg1:#06101e;--bg2:#0b2233;--line:rgba(120,220,200,.18);--panel:rgba(10,32,48,.55)}
[data-theme=space]{--acc:#dfe9ff;--acc2:#7aa2ff;--glow:160,190,255;--bg1:#04050c;--bg2:#0b0f22;--line:rgba(160,190,255,.18);--panel:rgba(14,18,38,.55)}
[data-theme=cyber]{--acc:#ff2fb9;--acc2:#21e6ff;--glow:255,47,185;--bg1:#0a0416;--bg2:#25063a;--line:rgba(255,47,185,.22);--panel:rgba(38,6,58,.5)}
[data-theme=sunset]{--acc:#ffb26b;--acc2:#ff5f6d;--glow:255,150,90;--bg1:#170710;--bg2:#3b1220;--line:rgba(255,160,110,.2);--panel:rgba(50,16,26,.5)}
[data-theme=sakura]{--acc:#ffc2dd;--acc2:#ff8fb1;--glow:255,180,215;--bg1:#150a12;--bg2:#331428;--line:rgba(255,190,220,.2);--panel:rgba(48,18,38,.5)}
[data-theme=forest]{--acc:#8ef0a0;--acc2:#35c98a;--glow:130,240,160;--bg1:#05120d;--bg2:#0d2a1e;--line:rgba(140,240,170,.18);--panel:rgba(10,38,28,.5)}
[data-theme=ocean]{--acc:#7fe6ff;--acc2:#2e9dff;--glow:120,220,255;--bg1:#04121f;--bg2:#082c47;--line:rgba(130,220,255,.2);--panel:rgba(6,34,54,.5)}
[data-theme=lava]{--acc:#ff8a3d;--acc2:#ff3b2f;--glow:255,120,50;--bg1:#120503;--bg2:#30100a;--line:rgba(255,140,70,.2);--panel:rgba(44,14,8,.5)}
[data-theme=mint]{--acc:#b6ffe0;--acc2:#45e0b0;--glow:170,255,225;--bg1:#04140f;--bg2:#0a2e26;--line:rgba(180,255,225,.2);--panel:rgba(8,38,32,.5)}
[data-theme=rose]{--acc:#ffd9b0;--acc2:#e8a1a1;--glow:255,215,180;--bg1:#130809;--bg2:#2c1414;--line:rgba(255,215,180,.2);--panel:rgba(44,20,20,.5)}
[data-theme=mono]{--acc:#ffffff;--acc2:#c9c9c9;--glow:255,255,255;--bg1:#000000;--bg2:#111111;--line:rgba(255,255,255,.16);--panel:rgba(20,20,20,.55)}
[data-theme=nebula]{--acc:#c9a6ff;--acc2:#7a5cff;--glow:190,160,255;--bg1:#080522;--bg2:#1a0d44;--line:rgba(190,160,255,.2);--panel:rgba(24,14,58,.5)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:var(--txt);
 font-family:"HarmonyOS Sans SC","MiSans","PingFang SC","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 -webkit-user-select:none;user-select:none}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}

#stage{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
 background:radial-gradient(130% 95% at 50% 0%,var(--bg2),var(--bg1) 58%,#01030a);
 transition:background .9s ease}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.9}
.glows{position:absolute;inset:0;z-index:1;pointer-events:none;filter:blur(58px);opacity:.5;transition:opacity .5s}
.glows i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;background:radial-gradient(circle,rgba(var(--glow),.55),transparent 70%);animation:drift 19s ease-in-out infinite}
.glows i:nth-child(1){top:-16vmax;left:-12vmax}
.glows i:nth-child(2){bottom:-20vmax;right:-14vmax;animation-delay:-7s;background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 45%,transparent),transparent 70%)}
.glows i:nth-child(3){top:32%;left:42%;width:28vmax;height:28vmax;animation-delay:-12s}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4vmax,-3vmax,0) scale(1.18)}}
body.noglow .glows{opacity:0}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(125% 85% at 50% 45%,transparent 42%,rgba(0,0,0,.6))}
.mask{position:absolute;inset:0;z-index:70;pointer-events:none;background:#000;opacity:0;transition:opacity .35s}

/* ========== 顶栏 ========== */
.topbar{position:relative;z-index:20;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:calc(var(--sa-t,0px) + 10px) 14px 6px}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;letter-spacing:.5px;opacity:.94;white-space:nowrap}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.chip{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--dim);
 backdrop-filter:blur(8px);white-space:nowrap;max-width:min(calc(var(--cw)*.34),calc(var(--ch)*.42));overflow:hidden;text-overflow:ellipsis}
.chip.hot{color:var(--acc);border-color:rgba(var(--glow),.5);box-shadow:0 0 12px rgba(var(--glow),.25)}
.ibtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--txt);
 font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);cursor:pointer;transition:.2s;padding:0}
.ibtn:active{transform:scale(.88)}
.ibtn.on{background:var(--acc);color:#04121a;border-color:transparent;box-shadow:0 0 16px rgba(var(--glow),.6)}

/* ========== 页面容器 ========== */
#pages{position:relative;z-index:15;flex:1 1 auto;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;display:none;flex-direction:column;padding:0 14px 6px;overflow-y:auto;overflow-x:hidden}
.page.on{display:flex;animation:fadeUp .36s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page::-webkit-scrollbar{width:0}

/* ========== 底部导航 ========== */
.tabbar{position:relative;z-index:20;flex:0 0 auto;display:flex;gap:4px;
 padding:5px 8px calc(var(--sa-b,0px) + 5px);
 background:linear-gradient(to top,rgba(2,6,12,.92),rgba(2,6,12,.35),transparent);backdrop-filter:blur(12px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--dim);
 font-size:10px;padding:6px 0 4px;border-radius:14px;cursor:pointer;transition:.22s;font-family:inherit}
.tab i{font-size:19px;font-style:normal;filter:grayscale(.75) opacity(.7);transition:.22s}
.tab.on{color:var(--acc)}
.tab.on i{filter:none;transform:translateY(-2px) scale(1.14);text-shadow:0 0 16px var(--acc)}

/* 沉浸模式 */
body.immerse .topbar,body.immerse .tabbar,body.immerse .quick,body.immerse .face-tabs{display:none}
body.immerse .page{padding:0}
body.immerse .cmeta{opacity:.5}
</style>

<style>
/* ========== 表盘切换 & 通用控件 ========== */
.face-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;flex:0 0 auto;scrollbar-width:none}
.face-tabs::-webkit-scrollbar{display:none}
.ftab{flex:0 0 auto;padding:6px 13px;border-radius:20px;font-size:12px;color:var(--dim);background:var(--panel);
 border:1px solid var(--line);cursor:pointer;transition:.22s;white-space:nowrap;font-family:inherit}
.ftab.on{color:#04121a;background:var(--acc);border-color:transparent;box-shadow:0 0 16px rgba(var(--glow),.45);font-weight:600}
.face-host{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.face{width:100%;display:none;flex-direction:column;align-items:center;justify-content:center}
.face.on{display:flex;animation:faceIn .45s cubic-bezier(.22,1,.36,1) both}
@keyframes faceIn{from{opacity:0;transform:scale(.94) translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.cmeta{flex:0 0 auto;text-align:center;padding:10px 0 2px;transition:opacity .4s}
.cm-date{font-size:12.5px;color:var(--dim);letter-spacing:1.2px}
.cm-greet{font-size:14px;margin-top:5px;color:var(--txt);opacity:.9}
.cm-tip{font-size:11.5px;color:var(--dim);opacity:.72;margin-top:5px;min-height:15px}
.quick{flex:0 0 auto;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:9px 0 4px}
.qbtn{padding:7px 13px;border-radius:12px;font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
 cursor:pointer;transition:.2s;font-family:inherit;backdrop-filter:blur(6px)}
.qbtn.on{color:var(--acc);border-color:rgba(var(--glow),.55);box-shadow:0 0 14px rgba(var(--glow),.28)}
.qbtn:active{transform:scale(.93)}

/* ========== 表盘 1：翻页钟 ========== */
.flip-wrap{display:flex;align-items:center;justify-content:center;gap:min(calc(var(--cw)*.018),calc(var(--ch)*.012));
  font-size:clamp(26px,min(calc(var(--cw)*.25),calc((var(--ch) - 250px)*.8)),320px);line-height:1;perspective:1400px}
body.landscape .flip-wrap{font-size:clamp(26px,min(calc(var(--cw)*.18),calc((var(--ch) - 190px)*.8)),520px)}
/* ===== 横屏专属结构：左栏纵向构图（大号 HH:MM + 底座：秒胶囊 + 分钟进度线） ===== */
body.landscape .flip-wrap{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}
body.landscape .flip-row{display:flex;align-items:center;gap:min(calc(var(--ch)*.02),calc(var(--cw)*.012))}
body.landscape .flip-strip{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
body.landscape .flip-sec{align-self:center;margin:0}
body.landscape .flip-bar{flex:1 1 auto;min-width:0;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
body.landscape .flip-bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .3s linear}
/* 单卡：上下双色面板 + 中缝 + 顶缘极光描边 */
.fd{--fdT:color-mix(in srgb,var(--bg2) 78%,#000);--fdB:color-mix(in srgb,var(--bg2) 58%,#000);--flipT:.26s;
  position:relative;width:.6em;height:1em;perspective:900px;border-radius:.095em;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 38%),
    linear-gradient(180deg,var(--fdT) 0 50%,var(--fdB) 50% 100%);
  box-shadow:0 .035em .07em rgba(0,0,0,.55),0 .1em .32em rgba(0,0,0,.42),
    0 0 0 1px color-mix(in srgb,var(--line) 75%,transparent),0 0 .9em rgba(var(--glow),.13)}
.fd::before{content:'';position:absolute;left:14%;right:14%;top:0;height:.018em;z-index:4;pointer-events:none;
  border-radius:0 0 .02em .02em;opacity:.7;
  background:linear-gradient(90deg,transparent,rgba(var(--glow),.85),transparent)}
.fd::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;z-index:4;transform:translateY(-.5px);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.62) 5%,rgba(0,0,0,.62) 95%,transparent)}
.fd .half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:transparent}
.fd .up{top:0}
.fd .dn{bottom:0;box-shadow:inset 0 1px 0 rgba(0,0,0,.5)}
.fd .dn span{transform:translateY(-50%)}
.fd .half span,.fd .leaf span{display:block;height:1em;line-height:1em;text-align:center;color:var(--txt);font-weight:600;
  font-variant-numeric:tabular-nums;text-shadow:0 .02em .06em rgba(0,0,0,.55),0 0 .5em rgba(var(--glow),.22)}
.fd .leaf{position:absolute;left:0;width:100%;height:50%;overflow:hidden;backface-visibility:hidden;will-change:transform}
.fd .leaf-u{top:0;transform-origin:50% 100%;display:none;border-radius:.095em .095em 0 0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fdT) 86%,#fff),var(--fdT));
  box-shadow:0 .03em .09em rgba(0,0,0,.6)}
.fd .leaf-l{top:50%;transform-origin:50% 0;transform:rotateX(90deg);display:none;border-radius:0 0 .095em .095em;
  background:var(--fdB);box-shadow:inset 0 .02em .05em rgba(0,0,0,.5)}
.fd .leaf-l span{transform:translateY(-50%)}
.fd.go .leaf-u{display:block;animation:flipU var(--flipT) cubic-bezier(.4,.05,.6,1) forwards}
.fd.go .leaf-l{display:block;animation:flipL var(--flipT) var(--flipT) cubic-bezier(.22,1,.36,1) forwards}
@keyframes flipU{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flipL{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
/* 冒号：两枚发光方点 */
.flip-colon{position:relative;flex:0 0 auto;width:.16em;height:.62em;align-self:center;font-size:1em;line-height:0;
  color:transparent;overflow:hidden;text-indent:-9em}
.flip-colon::before,.flip-colon::after{content:'';position:absolute;left:50%;width:.14em;height:.14em;margin-left:-.07em;
  border-radius:.05em;background:var(--acc);box-shadow:0 0 .16em var(--acc),0 0 .5em rgba(var(--glow),.6);
  animation:pulse 2s infinite}
.flip-colon::before{top:.08em}
.flip-colon::after{bottom:.085em;animation-delay:-1s}
/* 秒：胶囊徽标 */
.flip-sec{font-size:.2em;color:var(--acc);align-self:flex-end;margin-bottom:.3em;letter-spacing:.08em;
  padding:.28em .5em;border-radius:999px;background:rgba(var(--glow),.1);border:1px solid rgba(var(--glow),.3);
  text-shadow:0 0 .5em rgba(var(--glow),.7);font-variant-numeric:tabular-nums;min-width:1.95em;text-align:center}
.flip-sec:empty{display:none;border:0;background:transparent}

/* ========== 表盘 2：辉光管 ========== */
.nix{font-size:clamp(28px,min(calc(var(--cw)*.18),calc((var(--ch) - 300px)*.7)),240px);line-height:1;color:#ffb066;font-weight:400;letter-spacing:.02em;
 text-shadow:0 0 6px #ff8a2b,0 0 18px rgba(255,110,20,.75),0 0 42px rgba(255,90,10,.45),0 0 80px rgba(255,70,0,.25);
 animation:nixflicker 4.2s infinite}
body.landscape .nix{font-size:clamp(28px,min(calc(var(--cw)*.13),calc((var(--ch) - 230px)*.7)),240px)}
@keyframes nixflicker{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:.95}}
.nix-sub{margin-top:14px;font-size:12.5px;letter-spacing:4px;color:rgba(255,150,80,.6)}

/* ========== 表盘 3：极简大数字 ========== */
.dgt{font-size:clamp(30px,min(calc(var(--cw)*.26),calc((var(--ch) - 300px)*.7)),300px);font-weight:200;line-height:.95;letter-spacing:-.045em;color:var(--txt);
 text-shadow:0 0 40px rgba(var(--glow),.35)}
body.landscape .dgt{font-size:clamp(30px,min(calc(var(--cw)*.20),calc((var(--ch) - 230px)*.7)),300px)}
.dgt .sm{font-size:.42em;font-weight:300;color:var(--acc);vertical-align:super;letter-spacing:0;margin-left:.06em}
.dgt-line{height:2px;width:60%;margin-top:16px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);
 animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{opacity:.35;transform:scaleX(.6)}50%{opacity:1;transform:scaleX(1)}}
.dgt-date{margin-top:14px;font-size:13px;letter-spacing:3px;color:var(--dim)}

/* ========== 表盘 4：指针表盘 ========== */
.analog{position:relative;width:min(calc(var(--cw)*.72),max(150px, calc(var(--ch) - 250px)),320px);height:min(calc(var(--cw)*.72),max(150px, calc(var(--ch) - 250px)),320px);aspect-ratio:1}
.analog svg{width:100%;height:100%;overflow:visible}
.analog .dial{fill:color-mix(in srgb,var(--panel) 80%,transparent);stroke:var(--line);stroke-width:2}
.analog .tick{stroke:var(--dim);stroke-width:2;stroke-linecap:round;opacity:.65}
.analog .tick.maj{stroke:var(--acc);stroke-width:3.4;opacity:.95}
.analog .num{fill:var(--txt);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
.analog .hand{stroke:var(--txt);stroke-linecap:round;transform-origin:150px 150px;filter:drop-shadow(0 0 6px rgba(var(--glow),.6))}
.analog .h-hour{stroke-width:7}
.analog .h-min{stroke-width:4.5}
.analog .h-sec{stroke:var(--acc);stroke-width:2}
.analog .cap{fill:var(--acc);filter:drop-shadow(0 0 8px var(--acc))}
.analog .lume{fill:var(--acc);opacity:.9}
.analog .dg{fill:var(--dim);font-size:11px;text-anchor:middle}

/* ========== 表盘 5：环形进度 ========== */
.ringface{position:relative;width:min(calc(var(--cw)*.74),max(150px, calc(var(--ch) - 250px)),330px);height:min(calc(var(--cw)*.74),max(150px, calc(var(--ch) - 250px)),330px);aspect-ratio:1;display:grid;place-items:center}
.ringface svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringface circle{fill:none;stroke-linecap:round}
.ringface .rc-bg{stroke:rgba(255,255,255,.07)}
.ringface .rc-s{stroke:var(--acc);filter:drop-shadow(0 0 8px rgba(var(--glow),.8))}
.ringface .rc-m{stroke:var(--acc2)}
.ringface .rc-h{stroke:var(--txt);opacity:.5}
.ringface .rc-core{fill:color-mix(in srgb,var(--panel) 60%,transparent)}
.rf-txt{position:relative;text-align:center;z-index:2}
.rf-txt .t{font-size:clamp(24px,min(calc(var(--cw)*.09),calc(var(--ch)*.072)),52px);font-weight:300;letter-spacing:-.02em}
.rf-txt .s{font-size:12px;color:var(--dim);letter-spacing:2px;margin-top:4px}

/* ========== 表盘 6：点阵 LED ========== */
.dotface{display:flex;align-items:center;justify-content:center;gap:min(calc(var(--cw)*.016),calc(var(--ch)*.011))}
.dgroup{display:flex;gap:min(calc(var(--cw)*.005),calc(var(--ch)*.0035))}
.dchar{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);gap:min(calc(var(--cw)*.0042),calc(var(--ch)*.003))}
.dot{width:min(calc(var(--cw)*.0155),calc(var(--ch)*.011));height:min(calc(var(--cw)*.0155),calc(var(--ch)*.011));min-width:4.5px;min-height:4.5px;border-radius:50%;background:rgba(255,255,255,.055);transition:background .12s,box-shadow .12s}
.dot.on{background:var(--acc);box-shadow:0 0 6px var(--acc),0 0 14px rgba(var(--glow),.7)}
.dcolon{display:flex;flex-direction:column;justify-content:center;gap:min(calc(var(--cw)*.024),calc(var(--ch)*.017));padding:0 min(calc(var(--cw)*.004),calc(var(--ch)*.003))}
.dcolon i{width:min(calc(var(--cw)*.015),calc(var(--ch)*.0105));height:min(calc(var(--cw)*.015),calc(var(--ch)*.0105));min-width:4px;min-height:4px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 2s infinite}

/* ========== 表盘 7：霓虹描边 ========== */
.neon{font-size:clamp(44px,min(calc(var(--cw)*.23),calc(var(--ch)*.17)),175px);font-weight:700;line-height:1;color:transparent;
 -webkit-text-stroke:2px var(--acc);text-shadow:0 0 12px rgba(var(--glow),.9),0 0 34px rgba(var(--glow),.55),0 0 68px rgba(var(--glow),.3);
 letter-spacing:.02em}
.neon-wrap{position:relative;overflow:hidden;padding:14px 0}
.neon-wrap::after{content:"";position:absolute;left:0;right:0;height:26%;top:-30%;
 background:linear-gradient(180deg,transparent,rgba(var(--glow),.16),transparent);animation:scan 5.5s linear infinite}
@keyframes scan{0%{top:-30%}100%{top:120%}}
.neon-sub{margin-top:12px;font-size:12px;letter-spacing:6px;color:rgba(var(--glow),.75)}

/* ========== 表盘 8：文字钟 ========== */
.words{text-align:center;padding:0 calc(var(--cw)*.06)}
.words .big{font-size:clamp(20px,min(calc(var(--cw)*.084),calc(var(--ch)*.066)),58px);font-weight:300;line-height:1.5;letter-spacing:.05em}
.words .big b{font-weight:600;color:var(--acc);text-shadow:0 0 20px rgba(var(--glow),.55)}
.words .wseq{display:flex;gap:.4em;justify-content:center;flex-wrap:wrap;margin-top:18px}

.daybar{width:min(calc(var(--cw)*.76),420px);height:5px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:22px;overflow:hidden}

</style>

<style>
/* ========== 列表页通用 ========== */
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px;flex:0 0 auto}

.pill:active{transform:scale(.94)}
.pill.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);box-shadow:none;font-weight:500}

 animation:fadeUp .32s both;transition:.25s;position:relative;overflow:hidden}

.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.card-m{font-size:11.5px;color:var(--dim);margin-top:5px;letter-spacing:.5px}

 background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);transition:.2s}

/* ========== 分段 / 计时 ========== */

 font-family:inherit;cursor:pointer;transition:.22s}
.seg button.on{background:var(--acc);color:#04121a;font-weight:600;box-shadow:0 0 14px rgba(var(--glow),.35)}
.tpanel{display:none;flex-direction:column;align-items:center;gap:16px;padding-bottom:16px}
.tpanel.on{display:flex;animation:fadeUp .3s both}
.bigmono{font-family:"SF Mono",ui-monospace,monospace;font-size:clamp(30px,min(calc(var(--cw)*.13),calc(var(--ch)*.16)),84px);font-weight:300;
 letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(var(--glow),.3)}
.brow{display:flex;gap:11px;justify-content:center;width:100%;flex-wrap:wrap}
.brow.wrap{margin-top:6px}
.rbtn{min-width:104px;padding:13px 20px;border-radius:15px;font-size:14px;font-family:inherit;cursor:pointer;transition:.2s;
 border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);backdrop-filter:blur(8px)}
.rbtn:active{transform:scale(.94)}
.rbtn.primary{background:var(--acc);color:#04121a;border-color:transparent;font-weight:600;box-shadow:0 0 20px rgba(var(--glow),.45)}
.rbtn.danger{background:linear-gradient(135deg,#ff5f6d,#ff2d55);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 0 20px rgba(255,60,80,.5)}
.rbtn.ghost{background:var(--panel)}
.laps,.rounds{width:100%;max-height:calc(var(--ch)*.34);overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.laps::-webkit-scrollbar{width:0}
.lap{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 12px;border-radius:11px;
 background:var(--panel);border:1px solid var(--line);color:var(--dim);font-family:"SF Mono",ui-monospace,monospace}
.rounds{text-align:center;font-size:12.5px;color:var(--dim)}
.ringwrap{position:relative;width:min(calc(var(--cw)*.64),max(150px, calc(var(--ch) - 250px)),272px);height:min(calc(var(--cw)*.64),max(150px, calc(var(--ch) - 250px)),272px);aspect-ratio:1;display:grid;place-items:center}
.ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringsvg circle{fill:none;stroke-linecap:round}
.rbg{stroke:rgba(255,255,255,.07);stroke-width:9}
.rfg{stroke:var(--acc);stroke-width:9;stroke-dasharray:603;stroke-dashoffset:0;
 transition:stroke-dashoffset .28s linear;filter:drop-shadow(0 0 10px rgba(var(--glow),.75))}
.rfg.alt{stroke:var(--acc2);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc2) 70%,transparent))}
.rlabel{position:relative;text-align:center;z-index:2}
.rlabel .mono{font-size:clamp(26px,min(calc(var(--cw)*.10),calc(var(--ch)*.08)),54px);font-weight:300}
.rlabel .rsub{font-size:11.5px;color:var(--dim);letter-spacing:2px;margin-top:5px}
.chips,.steppers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips button{padding:8px 13px;border-radius:11px;font-size:12px;font-family:inherit;cursor:pointer;
 background:var(--panel);border:1px solid var(--line);color:var(--dim);transition:.2s}
.chips button.on{color:var(--acc);border-color:rgba(var(--glow),.55)}
.steppers label,.row label,.tpanel label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--dim);align-items:center}
.steppers input,.row input[type=number]{width:82px;padding:9px;border-radius:11px;text-align:center;font-size:15px;font-family:inherit;
 background:var(--panel);border:1px solid var(--line);color:var(--txt);outline:none}

/* ========== 世界时钟 ========== */
.city{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r);
 background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);animation:fadeUp .3s both}
.city-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.city-n{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city-s{font-size:11px;color:var(--dim);letter-spacing:.5px}
.city-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.city-t{font-size:21px;font-weight:300;font-family:"SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.city-d{font-size:10.5px;color:var(--dim)}
.city-del{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:transparent;color:#ff9a9a;font-size:12px;cursor:pointer}

/* ========== 设置 ========== */
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px;backdrop-filter:blur(10px);animation:fadeUp .3s both}
.bt{font-size:13px;font-weight:600;letter-spacing:.6px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bt.small{font-size:12px;font-weight:500;margin-top:14px;color:var(--dim)}
.note{font-size:11px;color:var(--acc);font-weight:400}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.05)}
.row:first-of-type{border-top:0}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.row span b{color:var(--acc);font-weight:600}
.row select{padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);font-size:12.5px;font-family:inherit;outline:none;max-width:52%}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:4px;background:rgba(255,255,255,.13);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--acc);
 box-shadow:0 0 12px rgba(var(--glow),.7);cursor:pointer}
.swi{position:relative;width:46px;height:26px;flex:0 0 auto;display:inline-block}
.swi input{opacity:0;width:0;height:0}
.swi i{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.12);transition:.25s;cursor:pointer}
.swi i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.swi input:checked+i{background:var(--acc);box-shadow:0 0 14px rgba(var(--glow),.5)}
.swi input:checked+i::after{transform:translateX(20px)}
.grid{display:grid;gap:9px}
.g-theme{grid-template-columns:repeat(6,1fr)}
.g-face{grid-template-columns:repeat(4,1fr)}
.g-fx{grid-template-columns:repeat(5,1fr)}
.g-sound{grid-template-columns:repeat(4,1fr)}
.g-theme i{height:36px;border-radius:12px;display:block;position:relative;border:2px solid transparent;cursor:pointer;transition:.22s}
.g-theme i.on{border-color:#fff;transform:scale(1.06);box-shadow:0 0 16px rgba(var(--glow),.55)}
.opt{padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:center;
 font-size:10.5px;color:var(--dim);cursor:pointer;transition:.2s;font-family:inherit}
.opt.on{color:var(--acc);border-color:rgba(var(--glow),.6);background:rgba(var(--glow),.12);box-shadow:0 0 14px rgba(var(--glow),.22)}
.opt b{display:block;font-size:15px;margin-bottom:3px;font-weight:400}
.g-sound .opt b{font-size:17px}

.sheet-mask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(3px)}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:calc(var(--ch)*.86);display:flex;flex-direction:column;
 background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 92%,#000),var(--bg1));
 border-top:1px solid var(--line);border-radius:26px 26px 0 0;transform:translateY(101%);transition:transform .34s cubic-bezier(.22,1,.36,1);
 box-shadow:0 -18px 50px rgba(0,0,0,.6)}
.sheet.on{transform:translateY(0)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:0 0 auto;border-bottom:1px solid rgba(255,255,255,.06)}
.shead b{font-size:15.5px;font-weight:600}
.sbody{padding:14px 18px calc(var(--sa-b,0px) + 22px);overflow-y:auto}
.sbody::-webkit-scrollbar{width:0}
.fld{margin-bottom:15px}
.fld>label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:8px;letter-spacing:.5px}
.fld input[type=text],.fld input[type=time],.fld input[type=number],.fld select{width:100%;padding:12px;border-radius:13px;
 background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);font-size:14px;font-family:inherit;outline:none}
.fld input[type=time]{font-size:22px;text-align:center;font-family:"SF Mono",ui-monospace,monospace;letter-spacing:2px}
.wk{display:flex;gap:6px;flex-wrap:wrap}
.wk button{flex:1;min-width:38px;padding:9px 0;border-radius:11px;font-size:12px;font-family:inherit;cursor:pointer;
 background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);transition:.2s}
.wk button.on{background:var(--acc);color:#04121a;border-color:transparent;font-weight:600}
.ring-list{display:flex;flex-direction:column;gap:8px}
.ring-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:13px;
 background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;cursor:pointer;transition:.2s}
.ring-opt.on{border-color:rgba(var(--glow),.6);color:var(--acc)}
.ring-opt .p{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--glow),.15);color:var(--acc);font-size:14px}

/* ========== 响铃全屏 ========== */
.ringov{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
 background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--acc) 22%,#000),#000 70%)}
.ringov.on{display:flex;animation:ringIn .4s both}
@keyframes ringIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.rocard{position:relative;text-align:center;padding:40px 26px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2}
.roPulse{position:absolute;top:50%;left:50%;width:56vmin;height:56vmin;margin:-28vmin 0 0 -28vmin;border-radius:50%;
 background:radial-gradient(circle,rgba(var(--glow),.34),transparent 68%);animation:roBreath 1.9s ease-in-out infinite}
@keyframes roBreath{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.roTime{position:relative;font-size:clamp(40px,min(calc(var(--cw)*.17),calc(var(--ch)*.14)),110px);font-weight:200;letter-spacing:-.02em;
 text-shadow:0 0 40px rgba(var(--glow),.5);animation:roShake 1.4s ease-in-out infinite}
@keyframes roShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.roLabel{position:relative;font-size:16px;color:var(--dim);letter-spacing:3px}
.ringov .brow{position:relative;margin-top:12px}

/* ========== Toast ========== */
#toast{position:fixed;left:50%;bottom:calc(var(--sa-b,0px) + 92px);transform:translate(-50%,20px);
 z-index:99;padding:11px 20px;border-radius:15px;background:rgba(12,18,30,.94);border:1px solid var(--line);
 color:var(--txt);font-size:13px;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(10px);max-width:min(calc(var(--cw)*.82),calc(var(--ch)*.9));text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 点击涟漪 */
.ripple{position:absolute;border-radius:50%;background:rgba(var(--glow),.4);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3.4);opacity:0}}

/* ========== 横屏（模拟旋转） ========== */
#stage.rot{position:fixed;top:50%;left:50%;transform-origin:center center}
body.landscape .topbar,body.landscape .tabbar{padding-left:max(14px,var(--sa-l,0px));padding-right:max(14px,var(--sa-r,0px))}
/* v3: 尺寸统一由 --cw/--ch(视觉宽高) 驱动，旧 vh override 已移除 */
/* 横屏布局优化 */
body.landscape .face-host{justify-content:flex-start}
body.landscape #pg-clock{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);grid-template-rows:auto 1fr auto;gap:8px;align-items:center}
body.landscape #pg-clock .face-tabs{grid-column:1/-1;grid-row:1}
body.landscape #pg-clock .face-host{grid-column:1;grid-row:2/4}
body.landscape #pg-clock .cmeta{grid-column:2;grid-row:2;text-align:left;padding-left:6px}
body.landscape #pg-clock .quick{grid-column:2;grid-row:3;justify-content:flex-start;align-content:flex-start}

body.landscape .tpanel{gap:10px}
</style>

<body>
<div id="stage">
  <canvas id="fx"></canvas>
  <div class="glows"><i></i><i></i><i></i></div>
  <div class="vignette"></div>
  <div class="mask" id="mask"></div>

  <header class="topbar">
    <div class="tb-left">
      <span class="brand"><i class="dot"></i>极光时钟</span>
      <span class="chip" id="chipBat">电量 --</span>
      <span class="chip" id="chipAlarm">无闹钟</span>
    </div>
    <div class="tb-right">
      <button class="ibtn" id="btnOrient" title="横竖屏">⟳</button>
      <button class="ibtn" id="btnImmerse" title="沉浸全屏">⛶</button>
      <button class="ibtn" id="btnKeep" title="屏幕常亮">☀</button>
      <button class="ibtn" id="btnTheme" title="换主题">🎨</button>
    </div>
  </header>

  <main id="pages">
    <!-- ========== 时钟 ========== -->
    <section class="page on" id="pg-clock">
      <div class="face-tabs" id="faceTabs"></div>
      <div class="face-host" id="faceHost"></div>
      <div class="cmeta">
        <div class="cm-date" id="cmDate"></div>
        <div class="cm-greet" id="cmGreet"></div>
        <div class="cm-tip" id="cmTip"></div>
      </div>
      <div class="quick" id="quick">
        <button class="qbtn" data-act="orient">横竖屏</button>
        <button class="qbtn" data-act="immerse">沉浸</button>
        <button class="qbtn" data-act="tick">滴答声</button>
        <button class="qbtn" data-act="chime">整点/半点报时</button>
        <button class="qbtn" data-act="sound">助眠声景</button>
        <button class="qbtn" data-act="fx">换动效</button>

    </section>

    <!-- ========== 闹钟 ========== -->
    <section class="page" id="pg-alarm">

      <div class="list" id="alarmList"></div>

    <!-- ========== 计时 ========== -->
    <section class="page" id="pg-timer">
      <div class="seg" id="timerSeg">
        <button class="on" data-t="sw">秒表</button>
        <button data-t="cd">倒计时</button>
        <button data-t="pomo">番茄钟</button>
      </div>

      <div class="tpanel on" id="tp-sw">
        <div class="bigmono mono" id="swDisp">00:00.00</div>
        <div class="brow">
          <button class="rbtn ghost" id="swLap">计次</button>
          <button class="rbtn primary" id="swRun">开始</button>
          <button class="rbtn ghost" id="swReset">重置</button>

        <div class="laps" id="swLaps"></div>
      </div>

      <div class="tpanel" id="tp-cd">
        <div class="ringwrap">
          <svg viewBox="0 0 220 220" class="ringsvg">
            <circle class="rbg" cx="110" cy="110" r="96"></circle>
            <circle class="rfg" id="cdRing" cx="110" cy="110" r="96"></circle>
          </svg>
          <div class="rlabel"><div class="mono" id="cdDisp">05:00</div><div class="rsub" id="cdSub">倒计时</div></div>
        </div>
        <div class="chips" id="cdPresets"></div>
        <div class="steppers">
          <label>分<input type="number" id="cdMin" min="0" max="600" value="5"></label>
          <label>秒<input type="number" id="cdSec" min="0" max="59" value="0"></label>
        </div>
        <div class="brow">
          <button class="rbtn ghost" id="cdReset">重置</button>
          <button class="rbtn primary" id="cdRun">开始</button>
        </div>
      </div>

      <div class="tpanel" id="tp-pomo">
        <div class="ringwrap">
          <svg viewBox="0 0 220 220" class="ringsvg">
            <circle class="rbg" cx="110" cy="110" r="96"></circle>

        </div>

          <label>专注<input type="number" id="pmWork" min="1" max="120" value="25"></label>
          <label>休息<input type="number" id="pmRest" min="1" max="60" value="5"></label>

        <div class="brow">
          <button class="rbtn ghost" id="pmReset">重置</button>
          <button class="rbtn primary" id="pmRun">开始</button>
        </div>
      </div>
    </section>

    <!-- ========== 世界时钟 ========== -->
    <section class="page" id="pg-world">
      <div class="phead"><h2>世界时钟</h2><button class="pill" id="btnAddCity">＋ 添加城市</button></div>
      <div class="list" id="worldList"></div>
    </section>

    <!-- ========== 设置 ========== -->
    <section class="page" id="pg-set">
      <div class="phead"><h2>设置</h2></div>

      <div class="blk">
        <div class="bt">主题配色 <span class="note" id="noteTheme">极光</span></div>
        <div class="grid g-theme" id="themeGrid"></div>

function cycleOrient(){
  S.orient = S.orient==='auto'?'landscape':(S.orient==='landscape'?'portrait':'auto');
  applyOrient(true); saveState();
  var sel=$('#oOrient'); if(sel) sel.value=S.orient;
  toast('屏幕方向：'+(S.orient==='auto'?'跟随系统':S.orient==='landscape'?'横屏':'竖屏'));

function applyOrient(notify){
  var vw=window.innerWidth, vh=window.innerHeight, vp=(vw>=vh)?'landscape':'portrait';
  var _ang=(window.orientation!=null?window.orientation:((window.screen&&screen.orientation)?screen.orientation.angle:0));
  _ang=Math.abs(Number(_ang)||0);
  var natural=(_ang>=45)?((_ang>=135)?'portrait':'landscape'):'portrait';
  if(_ang<45 && vp==='landscape') natural='landscape';
  var want=(S.orient==='auto')?natural:S.orient, st=$('#stage');
  if(!st) return;
  function orientSettle(){
    var w2=window.innerWidth, h2=window.innerHeight, v2=(w2>=h2)?'landscape':'portrait';
    if(v2===want){
      if(st.classList.contains('rot')){ st.classList.remove('rot'); st.style.width=''; st.style.height=''; st.style.transform=''; syncVV(); FX.resize(); }
    }else{
      st.classList.add('rot'); st.style.width=h2+'px'; st.style.height=w2+'px';
      st.style.transform='translate(-50%,-50%) rotate('+((want==='landscape')?90:-90)+'deg)';
    }
  }

  /* ① 有桥：交系统真转屏，页面不再自己旋转 */
  if(hasBridgeFn('setOrientation')){
    if(_lastOrient!==S.orient){ _lastOrient=S.orient;
      try{ B().setOrientation(S.orient==='auto'?'auto':S.orient); }catch(e){} }
    st.classList.remove('rot'); st.style.width=''; st.style.height=''; st.style.transform='';
    document.body.classList.toggle('landscape',want==='landscape');flipRelayout();
    setTimeout(function(){ orientSettle(); syncVV(); FX.resize(); },320);
    setTimeout(function(){ orientSettle(); },1000);
    if(notify) toast(want==='landscape'?'横屏（系统转屏）':'竖屏（系统转屏）');
    return;
  }

  /* ② 无桥回落：原 CSS 伪横屏（画面转 90°） */
  var rot=false, deg=0;
  if(want!==vp){ rot=true; deg=(want==='landscape')?90:-90; }
  if(rot){ st.classList.add('rot'); st.style.width=vh+'px'; st.style.height=vw+'px';
    st.style.transform='translate(-50%,-50%) rotate('+deg+'deg)'; }
  else { st.classList.remove('rot'); st.style.width=''; st.style.height=''; st.style.transform=''; }
  document.body.classList.toggle('landscape',want==='landscape');flipRelayout();
  syncVV();
  setTimeout(function(){ FX.resize(); },180);
  if(notify) toast(want==='landscape'?'横屏布局':'竖屏布局');
}

/* 点击报时：单击表盘播报当前时间（双击判定延迟，避免与沉浸切换冲突） */
var _tapLast=0,_tapTimer=null,_tapDbl=false;
function speakNow(){
  var d=new Date(), h=d.getHours(), m=d.getMinutes();
  var txt='现在是'+h+'点'+(m===0?'整':(m===30?'三十分':(m+'分')));
  AU.chime(S.chimeTone, m===0?h:0);
  toast('⏰ '+txt);
  haptic(16);
  /* 点击报时：优先 TTS；失败/pending 之外 → Web Audio 电子语音兜底（任何设备都能听到） */
  var _ok=false;
  try{ var b=B(); if(b&&b.speakText){ var r=b.speakText(txt,S.ttsVoice||null);
    _ok = (typeof r==='string' && (r.indexOf('"ok":true')>-1 || r==='pending')); } }catch(e){}
  if(!_ok) AU.say(txt);
}
(function(){
  var host=document.getElementById('faceHost');

  host.addEventListener('click',function(e){
    var t=e.target;
    if(t.closest&&t.closest('button,input,select,textarea,.tab,.qbtn,.chip,.swi')) return;
    var now2=Date.now();
    if(now2-_tapLast<300){ clearTimeout(_tapTimer); _tapLast=0; _tapDbl=true;
      if(document.body.classList.contains('immerse')) toggleImmerse();
      setTimeout(function(){ _tapDbl=false; },60); return; }
    _tapLast=now2;
    clearTimeout(_tapTimer);
    _tapTimer=setTimeout(function(){ if(_tapDbl) return; speakNow(); },320);
  });
})();

/* ---------- 主循环 ---------- */
var lastSec=-1,lastMin=-1,lastChip=0;
function onSecond(now){
  if(S.tick) AU.tick();
  if(S.chime&&(now.getMinutes()===0||now.getMinutes()===30)&&now.getSeconds()===0){
    var _hm=now.getMinutes();
    if(_hm===0){ AU.chime(S.chimeTone,now.getHours()); }
    else { AU.chime(S.chimeTone,0); }
    if(S.tts){ var _ok=false; try{ var _b=B(); if(_b&&_b.speakText){ var _r=_b.speakText(_hm===0?('现在是'+now.getHours()+'点整'):('现在是'+now.getHours()+'点三十分'),S.ttsVoice||null);
      _ok=(typeof _r==='string' && (_r.indexOf('"ok":true')>-1 || _r==='pending')); } }catch(e){}
      if(!_ok) AU.say(_hm===0?('现在是'+now.getHours()+'点整'):('现在是'+now.getHours()+'点三十分')); } }
  checkAlarms();
  var pg=$('#pg-world'); if(pg&&pg.classList.contains('on')) renderWorld();
  if(Date.now()-lastChip>15000){ lastChip=Date.now(); updateChips(); }
}
function loop(){
  var now=new Date();
  FACE.paint(now);
  var s=now.getSeconds();
  if(s!==lastSec){ lastSec=s; onSecond(now); }
  if(SW.run) swPaint();
  if(CD.run){ CD.left=Math.max(0,CD.end-Date.now()); cdPaint(); if(CD.left<=0) cdFinish(); }
  if(PM.run){ PM.left=Math.max(0,PM.end-Date.now()); pmPaint(); if(PM.left<=0) pmFinish(); }
  requestAnimationFrame(loop);
}

  if(de) de.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+W[d.getDay()];
  if(ge){ var h=d.getHours(), g='';
    if(h<5) g='夜深了，早点休息';
    else if(h<7) g='清晨好，新的一天开始啦';
    else if(h<9) g='早上好，今天也要加油';
    else if(h<11) g='上午好，状态在线';
    else if(h<13) g='中午好，记得吃午饭';
    else if(h<14) g='午后好，歇一会儿';
    else if(h<17) g='下午好，继续加油';
    else if(h<19) g='傍晚好，今天辛苦了';
    else if(h<23) g='晚上好，放松一下';
    else g='夜深了，早点休息';
    ge.textContent=g; }
}
renderMeta(); setInterval(renderMeta,20000);
  bindTop(); bindSettings(); bindTimers(); bindAlarm(); bindSystem();
  renderAlarms(); renderWorld(); updateChips();
  cdPaint(); pmPaint(); swPaint();
  requestAnimationFrame(loop);
  try{ var b=B(); if(b&&b.toast) b.toast('极光时钟已就绪'); }catch(e){}
}
init();
</script>
