pluginManagement {
    repositories {
        // Chaquopy 仓库
        maven { url = new java.net.URI('https://chaquo.com/maven') }
        // 国内镜像源
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/public/') }
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/google/') }
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/gradle-plugin/') }
        // 官方源作为备份
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Chaquopy 仓库
        maven { url = new java.net.URI('https://chaquo.com/maven') }
        // 国内镜像源
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/public/') }
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/google/') }
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/gradle-plugin/') }
        maven { url = new java.net.URI('https://maven.aliyun.com/repository/jcenter/') }
        // JitPack仓库
        maven { url = new java.net.URI('https://jitpack.io') }
        // 官方源作为备份
        google()
        mavenCentral()
    }
}

rootProject.name = "smartquiz"
include ":viewer"
