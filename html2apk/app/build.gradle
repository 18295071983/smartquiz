// ============================================================
// html2apk app 模块：63 桥 WebView 壳（与 apk_shell 同源：
// window.AndroidApp：TTS/方向/亮度/权限/SAF/截图/剪贴板/网络代理等）
// 打包参数通过 export_apk.ps1 生成的 build_config.properties 注入
// ============================================================
plugins { id 'com.android.application' }

// ---- 读取构建配置（UTF-8），键值来自 export_apk.ps1 ----
def props = new Properties()
def cfgPath = project.findProperty('configFile')
if (cfgPath) {
    def f = file(cfgPath)
    if (f.exists()) {
        f.withInputStream { ins ->
            props.load(new InputStreamReader(ins, 'UTF-8'))
        }
    }
}
def str = { key, defVal -> (props.getProperty(key) ?: defVal).toString() }

def appName      = str('appName', 'HTML App')
def appPackage   = str('appPackage', 'com.html2apk.wrapper')
def appVersionName = str('appVersionName', '1.0.0')
def appVersionCode  = (str('appVersionCode', '1') as String).toInteger()
def ksPath       = str('ksPath', 'keystore/html2apk-release.keystore')
def ksPass       = str('ksPass', 'html2apk123')
def ksAlias      = str('ksAlias', 'html2apk')
def ksAliasPass  = str('ksAliasPass', 'html2apk123')

android {
    namespace 'com.html2apk.wrapper'
    compileSdk 35

    defaultConfig {
        applicationId appPackage
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        // 应用显示名（支持中文），由 export_apk.ps1 注入
        manifestPlaceholders = [appLabel: appName]
    }

    signingConfigs {
        release {
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword ksAliasPass
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider（分享壳内文件）+ 前台服务；与 apk_shell 同源
    implementation 'androidx.core:core:1.13.0'
}
