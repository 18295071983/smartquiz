<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c4f8a">
<title>天气小助手</title>
<style>
:root{--sa-t:0px;--sa-b:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#fff;background:#0b1220}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,#5fb3f2,#2f80d0 46%,#1c4f89);transition:background .9s ease}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 55% at 50% -5%,rgba(255,255,255,.28),transparent 62%)}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(var(--sa-t) + 12px) 16px 4px}
.city{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:600;letter-spacing:.5px;padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.city:active{transform:scale(.97)}
.city .arrow{font-size:10px;opacity:.75}
.iconbtn{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.94)}
.spacer{margin-left:auto}
main{flex:1;overflow-y:auto;padding:10px 16px calc(var(--sa-b) + 26px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(6,20,40,.16)}
.now{padding:18px 18px 16px;margin-bottom:14px}
.nowtop{display:flex;align-items:center;gap:10px}
.temp{font-size:68px;line-height:1;font-weight:300;letter-spacing:-2px}
.temp i{font-size:30px;font-style:normal;font-weight:300;vertical-align:top;opacity:.85}
.desc{font-size:15px;opacity:.92;margin-top:9px}
.bigicon{margin-left:auto;font-size:60px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.nowmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:13px;opacity:.85}
.upd{margin-top:10px;font-size:11.5px;opacity:.62}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.fact{padding:12px 10px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);text-align:center;backdrop-filter:blur(10px)}
.fact .k{font-size:11px;opacity:.72;margin-bottom:5px}
.fact .v{font-size:15px;font-weight:600}
.block{padding:14px 14px 10px;margin-bottom:14px}
.bhead{font-size:13.5px;font-weight:600;opacity:.9;margin:0 4px 10px;display:flex;align-items:center;gap:6px}
.bhead span{font-weight:400;opacity:.6;font-size:11.5px;margin-left:auto}
.hours{display:flex;gap:12px;overflow-x:auto;padding:2px 4px 8px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hour{flex:0 0 auto;width:56px;text-align:center;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.08)}
.hour .h{font-size:11px;opacity:.72}
.hour .i{font-size:20px;margin:5px 0}
.hour .t{font-size:13.5px;font-weight:600}
.hour .p{font-size:10px;color:#8fd3ff;margin-top:2px;height:12px}
.days .day{display:flex;align-items:center;gap:10px;padding:9px 4px}
.days .day+.day{border-top:1px solid rgba(255,255,255,.1)}
.day .d{width:56px;font-size:13px;opacity:.9}
.day .di{width:26px;font-size:17px;text-align:center}
.day .dp{width:38px;font-size:11px;color:#8fd3ff}
.day .lo{width:34px;font-size:12.5px;text-align:right;opacity:.7}
.day .hi{width:34px;font-size:12.5px;text-align:right;font-weight:600}
.day .bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.day .bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#7fd4ff,#ffd479)}
.actions{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;padding:13px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.13);backdrop-filter:blur(10px);color:#fff;font-size:14px;font-weight:500}
.btn:active{transform:scale(.97)}
.foot{text-align:center;font-size:11px;opacity:.5;padding:6px 0 4px;line-height:1.7}
.err{margin:0 0 14px;padding:13px 15px;border-radius:18px;background:rgba(255,120,120,.18);border:1px solid rgba(255,140,140,.36);font-size:13px;line-height:1.7}
.err button{margin-top:9px;padding:8px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.14);color:#fff;font-size:13px}
.mask{position:fixed;inset:0;z-index:20;background:rgba(4,10,20,.55);backdrop-filter:blur(3px);display:none}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;background:linear-gradient(180deg,#243b57,#16263a);border-radius:24px 24px 0 0;padding:16px 16px calc(var(--sa-b) + 16px);animation:up .26s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.shead{display:flex;align-items:center;font-size:16px;margin-bottom:12px}
.shead span{margin-left:auto;font-size:15px;opacity:.7;padding:4px 8px}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow input{flex:1;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;font-size:14.5px;outline:none}
.srow input::placeholder{color:rgba(255,255,255,.45)}
.srow button{padding:0 18px;border-radius:14px;border:none;background:#3b9dfa;color:#fff;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{padding:7px 13px;border-radius:20px;font-size:12.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.chip:active{background:rgba(255,255,255,.24)}
.slist{overflow-y:auto;margin-top:6px}
.sitem{padding:13px 6px;font-size:14.5px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center}
.sitem small{font-size:11.5px;opacity:.6;margin-left:8px}
.sitem .cur{margin-left:auto;font-size:11.5px;color:#8fd3ff}
.sitem:active{background:rgba(255,255,255,.08)}
#toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:40;padding:11px 18px;border-radius:14px;background:rgba(0,0,0,.72);font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1}
.arow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid rgba(127,127,127,.15);font-size:14px}
.arow:last-of-type{border-bottom:none}
.arow .btn{width:auto;padding:8px 18px;font-size:13px}
.anote{font-size:12px;opacity:.6;line-height:1.6;margin-top:6px}
.warnbox{margin-bottom:14px;border-radius:20px;padding:14px 16px;font-size:13.5px;line-height:1.7;border:1px solid rgba(255,255,255,.3)}
.warnbox .wt{font-weight:700;font-size:14px}
.warnbox .wd{opacity:.92;margin-top:4px}
.warnbox.lv-blue{background:linear-gradient(135deg,rgba(56,132,255,.45),rgba(30,80,180,.3))}
.warnbox.lv-yellow{background:linear-gradient(135deg,rgba(240,190,50,.45),rgba(180,130,20,.3))}
.warnbox.lv-orange{background:linear-gradient(135deg,rgba(255,140,50,.48),rgba(190,90,20,.32))}
.warnbox.lv-red{background:linear-gradient(135deg,rgba(255,80,80,.5),rgba(170,30,40,.36))}
.tip{margin-top:9px;font-size:12.5px;opacity:.86;line-height:1.65}
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 2px 6px}
.idxi{padding:11px 8px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);text-align:center}
.idxi .ii{font-size:19px;line-height:1.1}
.idxi .in{font-size:11px;opacity:.72;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idxi .iv{font-size:13px;font-weight:600;margin-top:3px}
.idxi .id2{font-size:10.5px;opacity:.62;margin-top:4px;line-height:1.45;display:none;text-align:left}
.idxi.on{background:rgba(255,255,255,.2)}
.idxi.on .id2{display:block}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <div class="city" id="cityBtn"><span id="cityName">银川</span><span class="arrow">▼</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnLocate">📍</button>
    <button class="iconbtn" id="btnRefresh">⟳</button>
    <button class="iconbtn" id="btnAlert">⏰</button>
  </header>
  <main id="main">
    <section class="warnbox" id="warnBox" style="display:none"></section>
    <section class="card now" id="nowCard">
      <div class="nowtop">
        <div>
          <div class="temp"><span id="temp">--</span><i>°</i></div>
          <div class="desc" id="desc">正在获取天气…</div>
        </div>
        <div class="bigicon" id="bigicon">⏳</div>
      </div>
      <div class="nowmeta" id="nowmeta"></div>
      <div class="upd" id="upd"></div>
      <div class="tip" id="tips"></div>
    </section>
    <div class="err" id="err" style="display:none"></div>
    <section class="grid6" id="facts"></section>
    <section class="card block" id="idxBlock">
      <div class="bhead">生活指数<span id="idxTip"></span></div>
      <div class="idx" id="idx"></div>
    </section>
    <section class="card block" id="hourBlock">
      <div class="bhead">24 小时预报<span id="hourTip"></span></div>
      <div class="hours" id="hours"></div>
    </section>
    <section class="card block" id="dayBlock">
      <div class="bhead"><i id="dayHead" style="font-style:normal">15 天预报</i><span id="dayTip"></span></div>
      <div class="days" id="days"></div>
    </section>
    <div class="actions">
      <button class="btn" id="btnSpeak">🔊 语音播报</button>
      <button class="btn" id="btnShare">📤 分享天气</button>
    </div>
    <div class="foot" id="foot">数据来源 中国天气网 · 支持离线查看上次结果</div>
  </main>
</div>
<div class="mask" id="mask">
  <div class="sheet">
    <div class="shead"><b>切换城市</b><span id="sheetClose">✕</span></div>
    <div class="srow"><input id="q" placeholder="输入城市名，如 银川 / 三亚" autocomplete="off"><button id="goSearch">搜索</button></div>
    <div class="chips" id="chips"></div>
    <div class="slist" id="slist"></div>
  </div>
</div>
<div class="mask" id="amask">
  <div class="sheet">
    <div class="shead"><b>⏰ 早八天气提醒</b><span id="aClose">✕</span></div>
    <div class="arow"><span>每天推送天气</span><button class="btn" id="aToggle">开启</button></div>
    <div class="arow"><span>推送时间</span><button class="btn" id="aTime">07:30</button></div>
    <div class="anote">到点推送当天天气（天气/温度/穿衣小提示）。需保持 App 在后台运行；App 被系统清理后不会推送。</div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var AB=window.AndroidApp||null;
var DPR=window.devicePixelRatio||1;
function $(s){return document.querySelector(s);}

/* ===== 安全区（壳桥物理px ÷ DPR，上限64px防御） ===== */
function safeArea(){
  var t=0,b=0;
  try{if(AB&&AB.getStatusBarHeight){t=parseInt(AB.getStatusBarHeight(),10)||0;}}catch(e){}
  try{if(AB&&AB.getNavBarHeight){b=parseInt(AB.getNavBarHeight(),10)||0;}}catch(e){}
  t=Math.min(t/DPR,64);b=Math.min(b/DPR,64);
  document.documentElement.style.setProperty('--sa-t',t+'px');
  document.documentElement.style.setProperty('--sa-b',b+'px');
}

/* ===== 网络：优先走壳原生桥（无 CORS），否则 fetch ===== */
var netSeq=0;
function netGet(url,cb,hd){
  var done=false;
  var timer=setTimeout(function(){if(!done){done=true;cb(new Error('请求超时'));}},12000);
  function fin(err,text){if(done)return;done=true;clearTimeout(timer);cb(err,text);}
  if(AB&&typeof AB.request==='function'){
    var name='__netcb'+(++netSeq)+'_'+Date.now();
    window[name]=function(r){
      try{delete window[name];}catch(e){window[name]=undefined;}
      if(r&&r.status>=200&&r.status<300){fin(null,r.body);}
      else{fin(new Error((r&&(r.error||('HTTP '+r.status)))||'网络错误'));}
    };
    try{AB.request(url,'GET',JSON.stringify(hd||{}),'',name);}catch(e){fin(e);}
  }else if(window.fetch){
    fetch(url,{cache:'no-store'}).then(function(res){
      return res.text().then(function(txt){
        if(res.ok){fin(null,txt);}else{fin(new Error('HTTP '+res.status));}
      });
    }).catch(function(e){fin(e);});
  }else{fin(new Error('当前环境不支持网络请求'));}
}
function getJSON(url,cb,hd){
  netGet(url,function(err,text){
    if(err){return cb(err);}
    try{cb(null,JSON.parse(text));}catch(e){cb(new Error('数据解析失败'));}
  },hd);
}

/* ===== WMO 天气码 ===== */
var WMO={0:['晴','☀️'],1:['晴间多云','🌤️'],2:['多云','⛅'],3:['阴','☁️'],45:['有雾','🌫️'],48:['雾凇','🌫️'],51:['小毛毛雨','🌦️'],53:['毛毛雨','🌦️'],55:['大毛毛雨','🌧️'],56:['冻毛毛雨','🌧️'],57:['冻毛毛雨','🌧️'],61:['小雨','🌦️'],63:['中雨','🌧️'],65:['大雨','🌧️'],66:['冻雨','🌧️'],67:['冻雨','🌧️'],71:['小雪','🌨️'],73:['中雪','🌨️'],75:['大雪','❄️'],77:['雪粒','🌨️'],80:['小阵雨','🌦️'],81:['阵雨','🌧️'],82:['强阵雨','⛈️'],85:['小阵雪','🌨️'],86:['强阵雪','❄️'],95:['雷阵雨','⛈️'],96:['雷阵雨伴冰雹','⛈️'],99:['强雷暴冰雹','⛈️']};
function wx(code){return WMO[code]||['未知','🌡️'];}

/* ===== 主题（按天气+昼夜） ===== */
var THEME={
  clear_d:'linear-gradient(165deg,#57b6f5,#2b7fd4 48%,#1c4f8a)',
  clear_n:'linear-gradient(165deg,#26364f,#151f31 55%,#0a111d)',
  cloud_d:'linear-gradient(165deg,#94aec4,#5f7991 50%,#3b4e62)',
  cloud_n:'linear-gradient(165deg,#2c3c55,#1a2434 55%,#0d141f)',
  rain_d:'linear-gradient(165deg,#7490ab,#455a70 50%,#283848)',
  rain_n:'linear-gradient(165deg,#27374b,#182330 55%,#0b1118)',
  snow_d:'linear-gradient(165deg,#bdd1e4,#93abc5 50%,#6c849e)',
  snow_n:'linear-gradient(165deg,#3a4a63,#232f42 55%,#121a26)',
  thunder_d:'linear-gradient(165deg,#60649a,#353760 50%,#1a1b31)',
  thunder_n:'linear-gradient(165deg,#2b2c4d,#1a1b30 55%,#0c0c18)',
  mist_d:'linear-gradient(165deg,#a1afba,#74828e 52%,#4d5a66)',
  mist_n:'linear-gradient(165deg,#313d4a,#1e2730 55%,#101620)'
};
function kindOf(code){
  if([95,96,99].indexOf(code)>=0){return 'thunder';}
  if((code>=71&&code<=77)||code===85||code===86){return 'snow';}
  if((code>=51&&code<=67)||(code>=80&&code<=82)){return 'rain';}
  if(code===45||code===48){return 'mist';}
  if(code===2||code===3){return 'cloud';}
  return 'clear';
}
function themeOf(code,isDay){
  var k=kindOf(code);
  return THEME[k+(isDay?'_d':'_n')]||THEME.clear_d;
}
function lightTheme(code){var k=kindOf(code);return k==='snow'||k==='mist';}
function applyStatusBar(code,isDay){
  if(!AB||!AB.setStatusBarStyle){return;}
  try{AB.setStatusBarStyle(lightTheme(code)?'dark':'light');}catch(e){}
}

/* ===== 风向 ===== */
var DIRS=['北','东北偏北','东北','东北偏东','东','东南偏东','东南','东南偏南','南','西南偏南','西南','西南偏西','西','西北偏西','西北','西北偏北'];
function windName(deg){
  if(deg===null||deg===undefined||isNaN(deg)){return '--';}
  return DIRS[Math.round(deg/22.5)%16]+'风';
}

/* ===== 内置城市（geocoding 挂了也能用） ===== */
var PRESET=[
  {n:'银川',lat:38.421392,lon:106.263461,code:'101170101'},{n:'北京',lat:39.9042,lon:116.4074,code:'101010100'},
  {n:'上海',lat:31.2304,lon:121.4737,code:'101020100'},{n:'广州',lat:23.1291,lon:113.2644,code:'101280101'},
  {n:'深圳',lat:22.5431,lon:114.0579,code:'101280601'},{n:'成都',lat:30.5728,lon:104.0668,code:'101270101'},
  {n:'西安',lat:34.3416,lon:108.9398,code:'101110101'},{n:'杭州',lat:30.2741,lon:120.1551,code:'101210101'},
  {n:'武汉',lat:30.5928,lon:114.3055,code:'101200101'},{n:'南京',lat:32.0603,lon:118.7969,code:'101190101'},
  {n:'重庆',lat:29.5630,lon:106.5516,code:'101040100'},{n:'天津',lat:39.3434,lon:117.3616,code:'101030100'},
  {n:'乌鲁木齐',lat:43.8256,lon:87.6168,code:'101130101'},{n:'兰州',lat:36.0611,lon:103.8343,code:'101160101'},
  {n:'郑州',lat:34.7466,lon:113.6254,code:'101180101'},{n:'长沙',lat:28.2282,lon:112.9388,code:'101250101'},
  {n:'昆明',lat:24.8801,lon:102.8329,code:'101290101'},{n:'哈尔滨',lat:45.8038,lon:126.5350,code:'101050101'},
  {n:'三亚',lat:18.2528,lon:109.5119,code:'101310201'},{n:'青岛',lat:36.0662,lon:120.3826,code:'101120201'},
  {n:'厦门',lat:24.4798,lon:118.0894,code:'101230201'},{n:'拉萨',lat:29.6520,lon:91.1721,code:'101140101'},
  {n:'呼和浩特',lat:40.8414,lon:111.7519,code:'101080101'},{n:'西宁',lat:36.6171,lon:101.7782,code:'101150101'},
  {n:'沈阳',lat:41.8057,lon:123.4315,code:'101070101'},{n:'中卫',lat:37.5002,lon:105.1968,code:'101170501'},
  {n:'吴忠',lat:37.9869,lon:106.1988,code:'101170301'},{n:'石嘴山',lat:38.9843,lon:106.3844,code:'101170201'},
  {n:'固原',lat:36.0154,lon:106.2423,code:'101170401'}
];

  }catch(e){}
  return null;
}


/* ===== 工具 ===== */
function r0(v){return (v===null||v===undefined||isNaN(v))?'--':Math.round(v);}
function fmtTime(t){return t?String(t).slice(11,16):'';}
var WK=['周日','周一','周二','周三','周四','周五','周六'];
function fmtDay(ds,idx){
  if(idx===0){return '今天';}
  if(idx===1){return '明天';}
  var d=new Date(String(ds)+'T00:00:00');
  if(isNaN(d.getTime())){return String(ds).slice(5);}
  return WK[d.getDay()];
}
function normT(t){return String(t==null?'':t).replace('T',' ').slice(0,16);}
function hourIndexOf(d){
  var cur=normT((d.current&&d.current.time)||'');
  var arr=(d.hourly&&d.hourly.time)||[];
  if(!arr.length){return 0;}
  var i=-1;
  for(var k=0;k<arr.length;k++){if(normT(arr[k])===cur){i=k;break;}}
  if(i>=0){return i;}
  i=0;
  for(var k2=0;k2<arr.length;k2++){if(normT(arr[k2])<=cur){i=k2;}}
  return i;
}
function buildUrl(lat,lon){
  return 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m'
    +'&hourly=temperature_2m,weather_code,precipitation_probability,visibility'
    +'&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max'
    +'&timezone=auto&forecast_days=16';
}
function fetchHourly(place,cb){
  if(place.lat==null||place.lon==null){return cb(new Error('无坐标'));}
  getJSON(buildUrl(place.lat,place.lon),function(e,d){
    if(e||!d||!d.hourly||!d.hourly.time||!d.hourly.time.length){return cb(e||new Error('无逐小时数据'));}
    cb(null,d.hourly);
  });
}

/* ===== 渲染 ===== */
function render(place,d,isCached){
  var c=d.current||{},hourly=d.hourly||{},daily=d.daily||{};
  var isDay=c.is_day!==0;
  var w=wx(c.weather_code);
  $('#bg').style.background=themeOf(c.weather_code,isDay);
  applyStatusBar(c.weather_code,isDay);
  $('#temp').textContent=r0(c.temperature_2m);
  $('#desc').textContent=w[1]+' '+w[0];
  $('#bigicon').textContent=w[1];
  var hi=(daily.temperature_2m_max||[])[0],lo=(daily.temperature_2m_min||[])[0];
  try{if(ALERT.on&&AB&&AB.startForeground){AB.startForeground('天气 · '+place.name,w[0]+' '+r0(c.temperature_2m)+'℃  '+r0(lo)+'~'+r0(hi)+'℃');}}catch(e){}
  $('#nowmeta').innerHTML='<span>最高 '+r0(hi)+'°</span><span>最低 '+r0(lo)+'°</span><span>体感 '+r0(c.apparent_temperature)+'°</span>';
  $('#upd').textContent=(isCached?'⚠ 离线缓存 · ':'')+'更新于 '+fmtTime(c.time)+(d.obs?(' · 观测 '+d.obs):'');
  var hi2=hourIndexOf(d);
  var vis=c.visibility;
  if(vis===null||vis===undefined||isNaN(vis)){vis=(hourly.visibility||[])[hi2];}
  var vtxt='--';
  if(vis!==null&&vis!==undefined&&!isNaN(vis)){vtxt=(vis>=1000?(Math.round(vis/1000*10)/10)+' km':Math.round(vis)+' m');}
  var air=(c.quality||'')+(c.pm25===null||c.pm25===undefined?'':(c.quality?' · ':'')+'PM2.5 '+r0(c.pm25));
  var facts=[['湿度',r0(c.relative_humidity_2m)+'%'],['风速',r0(c.wind_speed_10m)+' km/h'],['风向',(c.wind_name||windName(c.wind_direction_10m))],['气压',r0(c.pressure_msl)+' hPa'],['空气质量',air||'--'],['能见度',vtxt]];
  $('#facts').innerHTML=facts.map(function(f){return '<div class="fact"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>';}).join('');
  var ht=(hourly.time||[]).length,hh='';
  var hbEl=$('#hourBlock');if(hbEl){hbEl.style.display=ht?'':'none';}
  for(var i=hi2;i<hi2+24&&i<ht;i++){
    var hw=wx((hourly.weather_code||[])[i]);
    var pp=(hourly.precipitation_probability||[])[i];
    hh+='<div class="hour"><div class="h">'+(i===hi2?'现在':fmtTime(hourly.time[i]))+'</div><div class="i">'+hw[1]+'</div><div class="t">'+r0((hourly.temperature_2m||[])[i])+'°</div><div class="p">'+((pp>=20)?pp+'%':'')+'</div></div>';
  }
  $('#hours').innerHTML=hh;
  var dbEl=$('#dayBlock');if(dbEl){dbEl.style.display=(daily.time&&daily.time.length)?'':'none';}
  var dt=daily.time||[],hmax=daily.temperature_2m_max||[],hmin=daily.temperature_2m_min||[];
  var mn=Math.min.apply(null,hmin.filter(function(v){return v!==null;})),mx=Math.max.apply(null,hmax.filter(function(v){return v!==null;}));
  if(!isFinite(mn)||!isFinite(mx)){mn=0;mx=1;}
  var span=(mx-mn)||1,dd='';
  for(var j=0;j<dt.length;j++){
    var left=Math.round((hmin[j]-mn)/span*100),wd=Math.max(9,Math.round((hmax[j]-hmin[j])/span*100));
    if(left+wd>100){left=100-wd;}
    var dw=wx((daily.weather_code||[])[j]);
    var dp=(daily.precipitation_probability_max||[])[j];
    dd+='<div class="day"><div class="d">'+fmtDay(dt[j],j)+'</div><div class="di">'+dw[1]+'</div><div class="dp">'+((dp>=20)?dp+'%':'')+'</div><div class="lo">'+r0(hmin[j])+'°</div><div class="bar"><i style="left:'+left+'%;width:'+wd+'%"></i></div><div class="hi">'+r0(hmax[j])+'°</div></div>';
  }
  $('#days').innerHTML=dd;
  var uv=(daily.uv_index_max||[])[0],sr=(daily.sunrise||[])[0],ss=(daily.sunset||[])[0];
  $('#hourTip').textContent=(sr?'☀ '+fmtTime(sr)+' 日出':'');
  $('#dayTip').textContent=(uv!==undefined&&uv!==null?'紫外线最强 '+r0(uv):'')+(ss?' · 🌙 '+fmtTime(ss)+' 日落':'');
  /* 生活指数 */
  var ix=d.idx||[],ib=$('#idxBlock');
  if(ib){ib.style.display=ix.length?'':'none';}
  var ih='';
  for(var q=0;q<ix.length;q++){ih+='<div class="idxi"><div class="ii">'+idxIcon(ix[q].n)+'</div><div class="in">'+ix[q].n+'</div><div class="iv">'+(ix[q].h||'--')+'</div><div class="id2">'+(ix[q].d||'')+'</div></div>';}
  var ie=$('#idx');if(ie){ie.innerHTML=ih;}
  var it=$('#idxTip');if(it){it.textContent=ix.length?(ix.length+' 项 · 点开看建议'):'';}
  /* 天气预警 */
  var al=d.alarm||[],wb=$('#warnBox');
  if(wb){if(al.length){var wh='';for(var x=0;x<al.length;x++){wh+='<div class="wt">'+(x?'':'⚠ ')+al[x].t+'</div>'+(al[x].d?'<div class="wd">'+al[x].d+'</div>':'');}wb.className='warnbox lv-'+(al[0].lv||lvOf(al[0].t));wb.innerHTML=wh;wb.style.display='';if(!isCached&&!d._nmc){toast('⚠ '+al[0].t);}}else{wb.style.display='none';}}
  /* 昨日对比 + 寄语 */
  var tp=[],ys=d.yest;
  if(ys&&ys.dh!==null&&!isNaN(ys.dh)){var dh=Math.round(ys.dh*10)/10,a2=Math.abs(dh),ylt='（昨 '+r0(ys.yl)+'~'+r0(ys.yh)+'°）';if(dh>0.05){tp.push('比昨天热 '+a2+'° '+ylt);}else if(dh<-0.05){tp.push('比昨天冷 '+a2+'° '+ylt);}else{tp.push('和昨天差不多 '+ylt);}}
  if(d.notice){tp.push('💬 '+d.notice);}
  var te=$('#tips');if(te){te.innerHTML=tp.length?tp.join('<br>'):'';}
  var dhe=$('#dayHead');if(dhe){dhe.textContent=dt.length+' 天预报';}
  S.data=d;
}

/* ===== 加载 ===== */
function load(place,isRefresh){
  if(!place||S.busy){return;}
  S.busy=true;S.place=place;
  $('#cityName').textContent=place.name;
  saveCity(place);
  hideErr();
  setLoading();
  if(isRefresh){toast('刷新中…');}
  fetchWeather(place,function(err,data){
    S.busy=false;
    if(err||!data||!data.current){
      var cached=readCache(place);
      if(cached){render(place,cached,true);toast('网络不通，先看上次的');}
      else{showErr('没取到天气数据：'+(err?err.message:'空数据'));}
      return;
    }
    writeCache(place,data);
    render(place,data,false);
    if(data._cn&&!(data.alarm&&data.alarm.length)){fetchAlarmNmc(place,function(al2){if(al2&&al2.length){data.alarm=al2;data._nmc=1;writeCache(place,data);render(place,data,false);}});}
  });
}

/* ===== 城市搜索 ===== */
function findPreset(n){
  for(var i=0;i<PRESET.length;i++){if(PRESET[i].n===n){return {name:PRESET[i].n,lat:PRESET[i].lat,lon:PRESET[i].lon};}}
  return null;
}
function buildChips(){
  $('#chips').innerHTML=HOT.map(function(c){return '<span class="chip" data-c="'+c+'">'+c+'</span>';}).join('');
  $('#chips').onclick=function(e){
    var t=e.target||{};
    var n=t.getAttribute?t.getAttribute('data-c'):null;
    if(!n){return;}
    var p=findPreset(n);
    if(p){closeSheet();load(p);}else{doSearch(n);}
  };
}
function openSheet(){$('#mask').classList.add('on');$('#q').focus();}
function closeSheet(){$('#mask').classList.remove('on');$('#slist').innerHTML='';}
function renderResults(list){
  var box=$('#slist');
  if(!list.length){box.innerHTML='<div class="sitem" style="opacity:.55">没有匹配的城市</div>';return;}
  box.innerHTML=list.map(function(r,i){return '<div class="sitem" data-i="'+i+'">'+r.name+(r.admin1?'<small>'+r.admin1+'</small>':'')+'</div>';}).join('');
  box.onclick=function(e){
    var el=e.target;
    while(el&&el!==box&&(!el.getAttribute||el.getAttribute('data-i')===null)){el=el.parentNode;}
    if(!el||el===box||!el.getAttribute){return;}
    var r=list[parseInt(el.getAttribute('data-i'),10)];
    if(!r){return;}
    closeSheet();
    load({name:r.name,lat:r.lat,lon:r.lon});
  };
}
function doSearch(kw){
  kw=(kw||'').trim();
  if(!kw){toast('先输个城市名吧');return;}
  var local=PRESET.filter(function(c){return c.n.indexOf(kw)>=0;}).map(function(c){return {name:c.n,lat:c.lat,lon:c.lon};});
  $('#slist').innerHTML='<div class="sitem" style="opacity:.55">搜索中…</div>';
  var url='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(kw)+'&count=8&language=zh&format=json';
  getJSON(url,function(err,data){
    var list=[];
    if(!err&&data&&data.results){
      list=data.results.map(function(r){
        return {name:r.name,admin1:[r.admin1,r.country].filter(function(x){return !!x;}).join(' '),lat:r.latitude,lon:r.longitude};
      });
    }
    if(!list.length){list=local;}
    if(!list.length){toast('没找到这个城市，换个名字试试');}
    renderResults(list);
  });
}

/* ===== 分享 / 语音播报 ===== */
function briefText(){
  if(!S.data||!S.data.current){return null;}

}

function speakText(){

  }else{toast('当前环境不支持语音');}
}

/* ===== 定位：国内IP库优先(B站)，打开自动认位置 ===== */
function ipLocate(cb){
  var apis=[
    {u:'https://api.live.bilibili.com/xlive/web-room/v1/index/getIpInfo',p:function(j){
      if(j&&j.code===0&&j.data&&j.data.latitude&&j.data.longitude){
        return {lat:parseFloat(j.data.latitude),lon:parseFloat(j.data.longitude),
                city:String(j.data.city||j.data.province||'当前位置').replace(/(市|区)$/,'')};
      }
      return null;}},
    {u:'https://ipwho.is/?lang=zh',p:function(j){
      if(j&&j.success!==false&&j.latitude&&j.longitude){return {lat:j.latitude,lon:j.longitude,city:j.city||j.region||'当前位置'};}
      return null;}},
    {u:'https://api.ip.sb/geoip',p:function(j){
      if(j&&j.latitude&&j.longitude){return {lat:j.latitude,lon:j.longitude,city:j.city||j.region||'当前位置'};}
      return null;}}
  ];
  var i=0;
  (function next(){
    if(i>=apis.length){return cb(new Error('IP定位失败'));}
    var a=apis[i++];
    getJSON(a.u,function(err,data){
      if(err||!data){return next();}
      var r=null;
      try{r=a.p(data);}catch(e){r=null;}
      if(r&&r.lat&&r.lon){cb(null,r);}else{next();}
    });
  })();
}
function applyLocated(lat,lon,name,note){
  load({name:name||'我的位置',lat:lat,lon:lon,code:cityCode(name),auto:true});
  if(note){toast(note);}
}
function samePlace(a,b){
  if(!a||!b){return false;}
  return Math.abs(a.lat-b.lat)<0.03&&Math.abs(a.lon-b.lon)<0.03;
}
function autoLocate(tries){
  tries=tries||0;
  if(S.busy&&tries<20){setTimeout(function(){autoLocate(tries+1);},300);return;}
  ipLocate(function(err,r){
    if(err||!r){return;}
    if(samePlace(S.place,r)){return;}
    applyLocated(r.lat,r.lon,r.city,'📍 已定位：'+r.city);
  });
}
function requestLocate(tries){
  tries=tries||0;
  if(S.busy&&tries<20){setTimeout(function(){requestLocate(tries+1);},300);return;}
  toast('正在通过网络定位…');
  ipLocate(function(err,r){
    if(err||!r){toast('定位失败，手动搜个城市吧');return;}
    applyLocated(r.lat,r.lon,r.city,'📍 已定位：'+r.city);
  });
}
/* ===== 早八天气提醒（前台服务 + 网页定时器） ===== */
var ALERT={on:false,h:7,m:30,last:''};
function fmt2(n){return (n<10?'0':'')+n;}
function alertLoad(){try{var v=localStorage.getItem('wx_alert_v1');if(v){ALERT=JSON.parse(v);}}catch(e){}}
function alertSave(){try{localStorage.setItem('wx_alert_v1',JSON.stringify(ALERT));}catch(e){}}
function alertUI(){
  var t=document.getElementById('aToggle'),tm=document.getElementById('aTime');
  if(t){t.textContent=ALERT.on?'关闭':'开启';}
  if(tm){tm.textContent=fmt2(ALERT.h)+':'+fmt2(ALERT.m);}
}
function alertOpen(){var m=document.getElementById('amask');if(m){m.classList.add('on');}alertUI();}
function alertClose(){var m=document.getElementById('amask');if(m){m.classList.remove('on');}}
function dressTip(t,txt){
  var s='';
  if(t<=5){s='，厚外套安排上';}
  else if(t<=12){s='，外套别忘';}
  else if(t<=20){s='，一件薄外套刚好';}
  else if(t<=28){s='，穿清爽点';}
  else{s='，热，注意防晒';}
  if(txt&&txt.indexOf('雨')>=0){s+=' 记得带伞☔';}
  return s;
}
function alertPush(){
  if(!S.place){setTimeout(alertPush,1500);return;}
  fetchWeather(S.place,function(err,data){
    var title='早安 · '+S.place.name, body;
    if(err||!data||!data.current){body='天气没取到，打开App看看吧～';}
    else{
      var c=data.current,daily=data.daily||{};
      var t=r0(c.temperature_2m),w=wx(c.weather_code);
      var hi=r0((daily.temperature_2m_max||[])[0]),lo=r0((daily.temperature_2m_min||[])[0]);
      body=w[0]+' '+t+'℃ · '+lo+'~'+hi+'℃'+dressTip(t,w[0]);
    }
    try{if(AB&&AB.showNotification){AB.showNotification(title,body);}}catch(e){}
    try{if(AB&&AB.vibrate){AB.vibrate(300);}}catch(e){}
  });
}
function alertTick(){
  if(!ALERT.on||!S.place){return;}
  var d=new Date();
  var key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  var now=d.getHours()*60+d.getMinutes(), target=ALERT.h*60+ALERT.m;
  if(now>=target && ALERT.last!==key){ALERT.last=key;alertSave();alertPush();}
}
function alertEnable(){
  function go(){
    ALERT.on=true;alertSave();alertUI();
    try{if(AB&&AB.startForeground){AB.startForeground('天气小助手','早八天气提醒已开启');}}catch(e){}
    try{if(AB&&AB.vibrate){AB.vibrate(60);}}catch(e){}
    toast('已开启：每天 '+fmt2(ALERT.h)+':'+fmt2(ALERT.m)+' 提醒');
    alertTick();
  }
  window.__alertPerm=function(r){if(r&&r.granted===false){toast('没拿到通知权限，去系统设置开一下');}go();};
  try{if(AB&&AB.requestPermission){AB.requestPermission('notification','__alertPerm');}else{go();}}catch(e){go();}
}
function alertDisable(){
  ALERT.on=false;alertSave();alertUI();
  try{if(AB&&AB.stopForeground){AB.stopForeground();}}catch(e){}
  toast('已关闭早八提醒');
}
