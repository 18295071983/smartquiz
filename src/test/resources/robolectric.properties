# Robolectric 全局配置（放在 src/test/resources/ 下，Robolectric 自动读取）
#
# ── 为什么是这两行，以及它们各自的坑 ──────────────────────────────────────────
#
# 1) includeAndroidResources 必须开（在 build.gradle 的 testOptions.unitTests 里）。
#    不开时 Robolectric 跑在 "legacy resources mode"，而该模式在 Android P 之后不受支持：
#    凡是 sdk >= 28 的用例会被**整类跳过**——Gradle 记成 skipped 而不是 failure，
#    看上去"全绿"，其实 11 个 Robolectric 类 128 条用例一条没跑（2026-10-19 才发现）。
#    早先为了躲 "Context.getColor 找不到" 而把等级降到旧 android-all 镜像，也是同一个根源的
#    错误解法：那个镜像之所以没有 getColor(int)，就是因为它跑在 legacy 模式的低档位。
#
# 2) sdk=33：本应用 targetSdk=36，Robolectric 4.10.3 最高只支持 33，
#    取支持上限，与真机行为最接近。个别类不要再自己 @Config(sdk = P)：
#    本应用 minSdk=31，28 档位下 Robolectric 解析应用自己的 ap_ 会抛
#    "Requires newer sdk version #31 (current version is #28)"，整类还没进方法就炸
#    （PreviewRenderBridgeTest 就是这么废掉的，已去掉它的 @Config）。
#
# 3) application=android.app.Application：开了 includeAndroidResources 之后
#    Robolectric 会按清单实例化真实的 SmartQuizApplication，而它 onCreate 里
#    `new AndroidPlatform()` 会 System.loadLibrary("crypto_chaquopy")——桌面 JVM 没有这个
#    .so，于是每个用例都在 beforeTest 阶段 UnsatisfiedLinkError。
#    这些用例要的是 Context / 资源 / filesDir，跟 Chaquopy 启动无关，所以全局换成裸 Application。
#    需要真实 Application 图（DI、Chaquopy、Room 单例、TemplateManager 初始化）的验证
#    本来就该放真机或 instrumentation test，不要在这里假装跑过。
sdk=33
application=android.app.Application
