# Robolectric 的 API 等级：必须显式钉住。
#
# 本应用 targetSdk=36，而 Robolectric 4.10.3 最高只支持 33；不钉等级时它会退到
# 更老的 android-all 镜像（本地缓存里只有 4.1.2_r1 / 9 / 13 三档），
# 那批框架类里根本没有 Context.getColor(int)（API 23 才有），
# 于是 ThemeColors.get() 的兜底分支在单测里抛 NoSuchMethodError，
# 表现为 ColorResourceProviderTest / ResourceIntegrationTest 成片红。
# 钉到 33 = Robolectric 4.10.3 支持的上限，与真机行为最接近。
sdk=33
