<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>起始页</title>
<style>
    :root {
        --bg: #0b1220;
        --card: #121b2e;
        --text: #e7edf7;
        --muted: #8fa0b8;
        --line: #24324a;
        --accent: #4f8cff;
    }
    @media (prefers-color-scheme: light) {
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #16233a;
            --muted: #6b7c93;
            --line: #dce4ef;
            --accent: #2563eb;
        }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
        background:
            radial-gradient(1200px 600px at 80% -10%, rgba(79, 140, 255, .18), transparent 60%),
            var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 20px 36px;
    }
    .main { width: 100%; max-width: 560px; }
    .brand { font-size: 23px; font-weight: 650; letter-spacing: .3px; }
    .sub { color: var(--muted); font-size: 13px; margin: 7px 0 22px; line-height: 1.6; }
    form {
        display: flex;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 14px 40px rgba(0, 0, 0, .18);
    }
    input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        padding: 16px;
    }
    input::placeholder { color: var(--muted); }
    button {
        border: 0;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        padding: 0 22px;
        font-weight: 600;
    }
    .links {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 22px;
    }
    a {
        display: flex;
        align-items: center;
        gap: 9px;
        text-decoration: none;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        font-size: 14px;
        overflow: hidden;
    }
    a:active { opacity: .75; }
    .badge {
        width: 27px;
        height: 27px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
    }
    .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tip { margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    @media (max-width: 420px) {
        .links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
</style>
</head>
<body>
<div class="main">
    <div class="brand">SmartQuiz 浏览器</div>
    <div class="sub">在地址栏输入网址，或直接搜索</div>
    <form action="https://www.baidu.com/s" method="get" accept-charset="UTF-8">
        <input name="wd" type="search" placeholder="搜索内容" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">搜索</button>
    </form>
    <div class="links">
        <a href="https://www.baidu.com"><span class="badge">百</span><span class="label">百度</span></a>
        <a href="https://www.zhihu.com"><span class="badge">知</span><span class="label">知乎</span></a>
        <a href="https://www.bilibili.com"><span class="badge">B</span><span class="label">哔哩哔哩</span></a>
        <a href="https://weibo.com"><span class="badge">微</span><span class="label">微博</span></a>
        <a href="https://www.qweather.com"><span class="badge">天</span><span class="label">和风天气</span></a>
        <a href="https://github.com"><span class="badge">G</span><span class="label">GitHub</span></a>
    </div>
    <div class="tip">点击右上角菜单可打开书签、历史记录与下载；长按链接可新标签页打开或复制地址。</div>
</div>
</body>
</html>
